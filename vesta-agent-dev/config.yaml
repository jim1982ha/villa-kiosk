# VESTA Agent host — Home Assistant app manifest (image-pull variant).
#
# Specification: docs/agent-host/SPEC.md (section 5 is this file).
#
# `image` makes the Supervisor PULL a prebuilt image from GHCR instead of
# building on the device — the HA Yellow never builds (SPEC H7). {arch} + version
# resolve to e.g. ghcr.io/jim1982ha/vesta-agent-aarch64:0.1.0, published by
# .github/workflows/agent-host.yaml.
#
# ⚠️ BUMP `version` ON EVERY PUSH. The Supervisor resolves image:<version>, never
# :latest, so an unchanged version is an update Home Assistant cannot see.
name: "VESTA Agent (dev)"
version: "0.12.1"
slug: vesta_agent_dev
description: "Runs the VESTA Agent, the villa's AI assistant"
url: "https://github.com/jim1982ha/villa-kiosk"
arch:
  - aarch64
  - amd64
image: "ghcr.io/jim1982ha/vesta-agent-agent-dev-{arch}"
# The HA base image ships s6-overlay v3 as its own init — disable Docker's.
init: false
startup: application
boot: auto
# ⚠️ NO LOCAL-ONLY PRIVILEGES (SPEC H3, PLAN F10). Home Assistant is reached with
# the "VESTA Agent" user's token, exactly as from outside the villa, so the same
# image behaves identically as a standalone container.
homeassistant_api: false
hassio_api: false
# ⚠️ H4 AMENDED (owner, 2026-09-30): one way in, Home Assistant's Ingress — the
# agent's UI (policy.yaml, the skills) in the sidebar, behind Home Assistant's
# login, for administrators only (panel_admin). Still no published port: the UI
# accepts only Home Assistant's Ingress gateway, and holds no secret.
ingress: true
ingress_port: 8095
panel_icon: mdi:robot-outline
panel_title: VESTA Agent
panel_admin: true
# addon_config → /config in the container, /addon_configs/<repo>_<slug> on the
# host: where VESTA Skills live so people can edit them from Home Assistant
# without a restart or a rebuild (H6). The dict form is the Supervisor's current
# syntax; the older `addon_config:rw` string is still accepted but converted.
map:
  - type: addon_config
    read_only: false
# SIGTERM → agent's stop grace → sidecar stop must all fit in here (SPEC 10).
timeout: 30
backup_exclude:
  - "*/cache/*"
  # The VESTA Agent's scratch folders (its work files and generated report
  # pages). Its conversations, approvals and incidents stay in backups.
  - "agent/work/*"
  - "agent/out/*"
# NOTE: the help text an operator SEES on the Configuration page lives in
# translations/en.yaml; agent-host/tests/check_manifest.py fails when a field
# is missing there, or when options and schema disagree.
#
# Secrets are `password` fields: masked in the UI, and the host redacts their
# values from every log line (H8). `telegram_bot_token` is never exported to the
# agent slot until `telegram_takeover` is true (H5).
options:
  agent_mode: stub
  ha_url: "http://homeassistant:8123"
  kiosk_url: "http://e66a2348-villa-kiosk-dev2:8099"
  telegram_takeover: false
  stub_heartbeat: false
  log_level: info
schema:
  agent_mode: list(stub|agent)
  anthropic_api_key: password?
  ha_url: url
  ha_token: password?
  kiosk_url: url
  kiosk_agent_token: password?
  telegram_takeover: bool
  telegram_bot_token: password?
  stub_heartbeat: bool
  log_level: list(debug|info|warning|error)
