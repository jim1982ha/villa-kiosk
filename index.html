<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Two variants, not one static value: the app's own theme defaults to
         "auto" (follows the OS), so a single colour would mismatch whichever
         mode the page actually rendered in half the time. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151b" />
    <meta name="application-name" content="Vesta Kiosk" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vesta Kiosk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" href="./icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="mask-icon" href="./icons/mask-icon.svg" color="#2f7a57" />
    <!-- use-credentials: if an auth gate (e.g. Cloudflare Access, or HTTP Basic
         Auth) ever sits in front of the kiosk hostname, the browser fetches the
         manifest and its icons WITHOUT credentials by default, gets a 401, and
         silently treats the app as non-installable (no "Install app" link).
         use-credentials sends the session cookie/credentials so it loads. -->
    <link rel="manifest" href="./manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <!-- No webfont fetch at all: --font-display was its own serif (Cormorant
         Garamond) but now just aliases --font-ui (see styles.css), so every
         typeface in the app is the native system font stack. -->
    <title>Vesta Kiosk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
