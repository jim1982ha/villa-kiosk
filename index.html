<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Two variants, not one static value: the app's own theme defaults to
         "auto" (follows the OS), so a single colour would mismatch whichever
         mode the page actually rendered in half the time. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F4EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101311" />
    <meta name="application-name" content="VESTA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VESTA" />
    <!-- "default", NOT "black-translucent" — this ONE value is the whole
         "empty bar at the bottom on iPhone" bug, reported repeatedly and
         chased through the CSS layer three times before it was measured.

         black-translucent asks iOS to hand the web view the WHOLE screen and
         let the page draw under the status bar. Since iOS 15 it does only
         half of that: the view is anchored at y=0 (so the villa really does
         render behind the clock and Dynamic Island — that part works), but
         its HEIGHT is still computed as screenHeight − statusBarHeight. The
         missing strip is therefore left over at the BOTTOM, outside the web
         view entirely, and iOS fills it with the manifest's background_color
         (#F7F4EE — light, with no dark counterpart possible in a manifest,
         which is why the band reads as a pale bar in either theme).

         Measured, not inferred, from a 2.296.0 telemetry record on an iPhone
         16 Pro home-screen PWA: standalone true, vw 402, vh 812. That screen
         is 402x874 and its top safe-area inset is 62 — and 874 − 812 = 62
         exactly. The frames record from the same session reports the canvas
         at 402x812 CSS, i.e. the app was already filling every pixel it was
         given. NO CSS CAN REACH THAT STRIP: the document does not extend
         there. That is why 2.162.0's canvas pinning could not have worked
         and only managed to break the map on Android and desktop.

         With "default" iOS reserves the status bar for itself and gives the
         page the entire remainder — the same 812pt, but positioned BELOW the
         bar with nothing left over. The app also stops paying for it twice:
         env(safe-area-inset-top) becomes 0 in standalone, so --safe-top goes
         to 0 and .hud-topbar no longer reserves 62pt of its own clearance,
         which is the Android/desktop path this CSS has always taken. The
         reserved strip is painted from the page's own theme-color/background,
         both of which already ship light and dark variants.

         Cost: the render no longer bleeds up behind the status bar. Nothing
         but the canvas ever used that band — the HUD was already inset below
         it — so this trades a decoration for the bug.

         This meta is iOS-standalone-only: Android, desktop and HA Ingress
         cannot observe it at all, which is the property 2.162.0 lacked.

         ⚠️ iOS caches this whole apple-mobile-web-app-* block AT ICON
         CREATION. An already-installed PWA keeps the old presentation
         forever — the home-screen icon MUST be deleted and re-added before
         this takes effect. If the band is still there after re-adding, the
         cause is not this block and the next measurement is the screen-vs-
         window delta now carried on every telemetry event (utils/telemetry.ts). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="./favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="mask-icon" href="./icons/mask-icon.svg" color="#2F6B4F" />
    <!-- use-credentials: if an auth gate (e.g. Cloudflare Access, or HTTP Basic
         Auth) ever sits in front of the kiosk hostname, the browser fetches the
         manifest and its icons WITHOUT credentials by default, gets a 401, and
         silently treats the app as non-installable (no "Install app" link).
         use-credentials sends the session cookie/credentials so it loads. -->
    <link rel="manifest" href="./manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <!-- NO apple-touch-startup-image links, deliberately — do not "complete"
         this list, remove it.

         2.144.0 added three of them (two iPad postures + one iPhone size).
         Apple matches these by EXACT device metrics, and the iPhone entry was
         `390x844@3x` — the base 12/13/14/15/16 only. Every Pro, Pro Max,
         Plus, mini and SE, and every iPad that isn't the 9.7" class, matched
         nothing. When a standalone PWA declares startup images and none
         matches, iOS does not simply skip the splash: it falls back to a
         black launch surface and sizes the standalone presentation from the
         declared set rather than the true screen, which letterboxed the app
         between solid black bands top and bottom (reported on an iPhone home
         -screen PWA, with Android and desktop unaffected — neither has this
         mechanism at all).

         An exhaustive matrix is not the fix: Apple adds device metrics every
         year, so the list is wrong again on the next handset, and each splash
         is a ~1.4 MB PNG in a bundle whose whole point is precaching for an
         offline villa. With no links at all, iOS uses its own default
         standalone behaviour — genuinely full-bleed, which is what shipped
         for the app's whole life before 2.144.0. The source artwork is kept
         in sources/files/rebrand/assets/splash/ if this is ever revisited.

         NOTE: iOS caches this whole apple-mobile-web-app-* block when the
         icon is created, so an already-installed PWA must be removed from the
         home screen and re-added before any change here takes effect. -->
    <!-- Self-hosted, not a Google Fonts link — the kiosk's target is an iPad
         with no internet at all, only a LAN path to Home Assistant (see
         CLAUDE.md's offline rule). Both files live in public/fonts/ and are
         declared via @font-face at the top of styles.css; preloading here
         avoids the flash of fallback type on first paint. -->
    <link rel="preload" href="/fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/public-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>VESTA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
