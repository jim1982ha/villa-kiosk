<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Two variants, not one static value: the app's own theme defaults to
         "auto" (follows the OS), so a single colour would mismatch whichever
         mode the page actually rendered in half the time. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F4EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101311" />
    <meta name="application-name" content="VESTA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VESTA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="./favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="mask-icon" href="./icons/mask-icon.svg" color="#2F6B4F" />
    <!-- use-credentials: if an auth gate (e.g. Cloudflare Access, or HTTP Basic
         Auth) ever sits in front of the kiosk hostname, the browser fetches the
         manifest and its icons WITHOUT credentials by default, gets a 401, and
         silently treats the app as non-installable (no "Install app" link).
         use-credentials sends the session cookie/credentials so it loads. -->
    <link rel="manifest" href="./manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <!-- Apple ignores the manifest/theme-color for the launch splash it shows
         while the app is loading — it's tied to these link tags, matched by
         exact device metrics. Only the two real iPad postures + iPhone
         portrait are wired (the kiosk's actual targets, per CLAUDE.md); no
         generic Android/tablet splash mechanism exists for Apple to wire. -->
    <link rel="apple-touch-startup-image" href="./splash/splash-ipad-1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./splash/splash-ipad-landscape-2048x1536.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="./splash/splash-iphone-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- Self-hosted, not a Google Fonts link — the kiosk's target is an iPad
         with no internet at all, only a LAN path to Home Assistant (see
         CLAUDE.md's offline rule). Both files live in public/fonts/ and are
         declared via @font-face at the top of styles.css; preloading here
         avoids the flash of fallback type on first paint. -->
    <link rel="preload" href="/fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/public-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>VESTA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
