# Field labels and help text for the app's Configuration page.
#
# Supervisor renders `name` as each field's label and `description` as the help
# text underneath it. Keep them decision-oriented: the reader's question is
# "what do I put in this box". The reasoning lives in config.yaml and DOCS.md.
configuration:
  anthropic_api_key:
    name: Anthropic API key
    description: >-
      Key from the Anthropic Console. Until it is set the agent waits (the
      VESTA Agent page still opens) and its log says so.
  ha_url:
    name: Home Assistant address
    description: >-
      Home Assistant as seen from this app. Keep the default on the same
      machine.
  ha_token:
    name: Home Assistant token
    description: >-
      Long-lived access token of the dedicated "VESTA Agent" Home Assistant
      user: Administrator on, Active on, "Can only log in from the local
      network" on. Keep the user active — Home Assistant refuses the token of a
      deactivated user. Until it is set the agent waits.
  kiosk_url:
    name: VESTA Kiosk address
    description: >-
      Base address of the VESTA Kiosk agent interface. The default points at the
      VESTA Kiosk on the same machine (VESTA (dev2) for the dev channel).
  kiosk_agent_token:
    name: VESTA Kiosk agent token
    description: The same value as the agent token set in the VESTA Kiosk.
  telegram_takeover:
    name: Agent replies on Telegram
    description: >-
      Toggle to indicate if the Agent can send and answer messages to the
      villa's Telegram bot (if OFF, the agent sends nothing)
  telegram_bot_token:
    name: Telegram bot token
    description: The villa bot's token. Used only when "Agent replies on Telegram" is ON.
  log_level:
    name: Log level
    description: Detail of the host and agent logs. Secrets are never logged.
