# Field labels and help text for the app's Configuration page.
#
# Supervisor renders `name` as each field's label and `description` as the help
# text underneath it. Keep them decision-oriented: the reader's question is
# "what do I put in this box". The reasoning lives in config.yaml and DOCS.md.
configuration:
  agent_mode:
    name: Agent mode
    description: >-
      "stub" runs only the self-test, which checks every connection and does
      nothing else. "agent" runs the VESTA Agent itself; it needs the Anthropic
      API key and the Home Assistant token below.
  anthropic_api_key:
    name: Anthropic API key
    description: >-
      Key from the Anthropic Console. Required in agent mode; in stub mode the
      Anthropic check is skipped without it.
  ha_url:
    name: Home Assistant address
    description: >-
      Home Assistant as seen from this app. Keep the default on the same
      machine.
  ha_token:
    name: Home Assistant token
    description: >-
      Long-lived access token of the dedicated "VESTA Agent" Home Assistant
      user: Administrator on, Active on, "Can only log in from the local
      network" on. Keep the user active — Home Assistant refuses the token of a
      deactivated user. Required in agent mode.
  kiosk_url:
    name: VESTA Kiosk address
    description: >-
      Base address of the VESTA Kiosk agent interface. The default points at the
      VESTA Kiosk on the same machine (VESTA (dev2) for the dev channel).
  kiosk_agent_token:
    name: VESTA Kiosk agent token
    description: The same value as the agent token set in the VESTA Kiosk.
  telegram_takeover:
    name: Telegram takeover
    description: >-
      ON lets the agent send on the villa's bot. Home Assistant keeps receiving
      the bot's messages and buttons either way; the agent reads them from Home
      Assistant. While OFF the bot token is never given to the agent and it sends
      nothing. Only one app (dev or stable) should have it ON.
  telegram_bot_token:
    name: Telegram bot token
    description: The villa bot's token. Used only when Telegram takeover is ON.
  stub_heartbeat:
    name: Stub heartbeat
    description: >-
      In stub mode, test the whole connection with the VESTA Kiosk: the agent
      shows as online there, and at each start the stub posts one test message
      with two buttons — the button you press is written in this app's log.
      Leave OFF otherwise.
  log_level:
    name: Log level
    description: Detail of the host and agent logs. Secrets are never logged.
