# rootfs/etc/nginx/snippets/backend-proxy.conf
#
# What EVERY location forwarding to the add-on's proxy (127.0.0.1:8100) sends.
#
# ⚠️ X-VK-Ingress IS AN OWNER CREDENTIAL. supervisor-proxy.py's `_is_ingress`
# treats `X-VK-Ingress: 1` as "came through Home Assistant's Ingress", which is
# the owner. It is only unforgeable because nginx OVERWRITES whatever the
# client sent — and nginx does that per location: a location that sets any
# proxy_set_header of its own inherits none from above. This line used to be
# written by hand in nine locations, and a tenth that forgot it would have
# forwarded the client's own header — owner access for anyone who typed it.
# tests/routes.py now fails any location reaching 8100 without this include.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-VK-Ingress $vk_ingress;
