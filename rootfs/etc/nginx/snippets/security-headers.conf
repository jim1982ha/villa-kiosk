# rootfs/etc/nginx/snippets/security-headers.conf
#
# ⚠️ nginx DOES NOT MERGE `add_header` ACROSS LEVELS — a location with its own
# `add_header` ignores every one set above it. That is the whole hazard, and
# repeating the headers by hand in each such location is how it was handled
# until 2.957.0. The count drifted: the note in nginx.conf said "the locations
# that set Cache-Control (/, /assets/)" and there were THREE. `location /`
# repeated all six, `/assets/` repeated one, and `/model/` — the villa's floor
# plan, the one static route behind `auth_request` — repeated none, so it was
# served with no nosniff and no Referrer-Policy.
#
# Included rather than transcribed, so a fourth location that sets
# `Cache-Control` gets these by adding one line rather than by the author
# remembering a comment 400 lines up.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
