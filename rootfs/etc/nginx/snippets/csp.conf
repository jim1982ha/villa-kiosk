# rootfs/etc/nginx/snippets/csp.conf
#
# The app shell's Content-Security-Policy — included at the server level and
# in `location /` (which sets its own Cache-Control, so nginx would drop the
# server-level copy there). Written out twice, word for word, until 2.496.173.
#
# Content-Security-Policy ships REPORT-ONLY first, on purpose.
#
# The policy below is derived from what the app actually needs, verified
# against the source rather than guessed: 'wasm-unsafe-eval' + blob: for the
# Draco decoder, blob: workers, 'unsafe-inline' styles because React writes
# style attributes, the two Google Fonts origins from index.html, and
# permissive media:/connect: because HA camera streams and the websocket are
# reached over whatever scheme the instance uses. frame-ancestors keeps the
# Ingress iframe working while blocking everyone else.
#
# Report-Only because a wrong CSP bricks a kiosk that someone has to be
# physically present to recover, and the cost of being wrong is far higher
# than the delay in enforcing. Violations appear in the browser console:
# load the kiosk on a phone and a laptop, exercise cameras/upload/3D, and if
# nothing is reported, rename this single header to Content-Security-Policy
# to enforce it. Shipping it Report-Only is what makes that test possible at
# all — before this there was no policy to test.
#
# `blob:` IS in connect-src, and that is not decoration: the model is handed
# to Babylon as a blob URL and its loader FETCHES that URL, so enforcing the
# policy without it would have stopped the villa loading at all. The report
# said so from a real device ("Connecting to 'blob:...' violates ...") —
# which is the entire reason this header ships report-only first.
#
# A `static.cloudflareinsights.com/beacon.min.js` violation is NOT ours to
# allow: Cloudflare injects that script into proxied responses, and this
# kiosk must work on a villa LAN with no internet. Leave it blocked; turn
# Web Analytics off for the hostname instead.
#
# ⚠️ `fonts.googleapis.com` / `fonts.gstatic.com` WERE PERMITTED HERE UNTIL
# 2.496.24, AT BOTH SITES, AND NOTHING EVER FETCHED THEM. The fonts are
# self-hosted variable woff2 files served by this same nginx — the offline
# rule's whole point. What the grant was, was standing permission for the
# next person to add a `<link>` tag and have it work on their desk and fail
# on the wall. Report-Only made it invisible: no violation, because no
# request. Removed, and `tests/hard-rules.py` now fails the build on any
# third-party host in ANY shipped file — this one lived in `rootfs/`, which
# is why a guard scoped to `src/` ran for eight versions without seeing it.
#
# `report-uri telemetry` (2.496.207): violations were only ever visible in a
# device's own console, so "nothing was reported" meant "nobody looked".
# The browser now POSTs each one to the add-on's telemetry endpoint — the
# path is RELATIVE on purpose, so it resolves under the Ingress prefix and
# on the direct port alike — where supervisor-proxy.py stores it as a `csp`
# event that Settings › Telemetry lists. Enforce once the ring stays quiet.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: http: https:; connect-src 'self' blob: ws: wss: http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.home-assistant.io; report-uri telemetry" always;
