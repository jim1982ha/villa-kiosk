# Serves the static VESTA build on port 8099, reachable TWO ways:
#   * Home Assistant Ingress gateway (172.30.32.2) — the sidebar panel.
#   * The add-on's directly-exposed port (config.yaml `ports`) — e.g. a
#     Cloudflare Tunnel pointed at it, so the kiosk opens on its own hostname
#     with no HA UI around it.
# `/core/` is forwarded to the local Supervisor proxy (supervisor-proxy.py),
# which injects the add-on's SUPERVISOR_TOKEN so the browser stays token-less.
# Because the port is now public, the proxy authenticates every sensitive
# request: Ingress-sourced ones are trusted (tagged X-VK-Ingress below, from the
# real gateway IP so a client can't forge it); direct ones must carry the
# session cookie /auth/verify mints. /model/ is static, so it's gated here via
# an auth_request subrequest to the proxy's /auth/check.
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  sendfile      on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  # Don't advertise the nginx version in Server headers / error pages
  # (CWE-200 information disclosure — makes fingerprinting a known-vulnerable
  # nginx build one step harder on the publicly-exposed port).
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  # The central GLB is the largest transfer by far. Its geometry buffers (float
  # vertex/normal/UV data) compress well, so gzip meaningfully cuts download time
  # on the remote (DuckDNS) path. Embedded textures are already compressed and
  # won't shrink, hence a modest comp level to keep per-request CPU low on the HA
  # host. .glb has no mapped MIME type here so it's served as octet-stream.
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml
             model/gltf-binary application/octet-stream;

  # Toggle the Connection header for WebSocket upgrades.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 1 when the request comes from the HA Ingress gateway, 0 otherwise (direct/
  # Cloudflare/LAN). Keyed on $remote_addr, which the client cannot spoof for an
  # internal Supervisor address. Forwarded to the proxy as X-VK-Ingress so it
  # can trust Ingress-sourced calls (HA already authed them) and require a
  # session cookie on everything else. proxy_set_header overwrites any
  # client-supplied X-VK-Ingress, so the flag is authoritative.
  geo $vk_ingress {
    default     0;
    172.30.32.2 1;
  }

  # Cache-Control for /model/ (below) must differ by request shape, not be
  # uniform: storage.ts's versionedModelUrl() first HEADs the BARE (query-less)
  # path to read the file's current ETag/Last-Modified, then appends that as
  # ?v=<tag> before the real download — that's what lets the client detect a
  # replaced file at all. A single long max-age on the whole location applied
  # to that HEAD probe too, so the browser's own HTTP cache could keep
  # answering it with the OLD file's headers for up to an hour after every
  # re-upload — producing the same stale ?v= tag, which then hit the same
  # entry in the service worker's model cache. Net effect: a freshly
  # (re)uploaded GLB/SH3D could silently fail to take effect for up to an
  # hour, no matter how many times the admin re-uploaded or hard-refreshed.
  # A request that already carries ?v=<tag> is a distinct, immutable URL by
  # construction (a changed file always gets a new tag) — safe to cache
  # forever. The bare/unversioned path (used only for the probe, and as a
  # fallback if that probe fails) must always revalidate.
  map $arg_v $model_cache_control {
    default "no-cache";
    "~.+"   "public, max-age=31536000, immutable";
  }

  server {
    listen 8099 default_server;
    server_name _;

    # Both the Ingress gateway and direct/Cloudflare callers are accepted now;
    # the app shell + hashed assets are non-sensitive static files, and every
    # sensitive route below is authenticated (session cookie or trusted Ingress
    # source — see the geo block and the supervisor-proxy).
    root  /var/www;
    index index.html;

    # Defense-in-depth response headers (HA Ingress fronts us, but cheap to add).
    # NOTE: nginx does NOT merge add_header across levels — a location with its
    # own add_header ignores these. So the security headers are repeated in the
    # locations that set Cache-Control (/, /assets/) where they actually matter.
    # Permissions-Policy: the kiosk never uses getUserMedia/geolocation/payment
    # etc. (HA camera streams arrive over plain HTTP, not the camera API) —
    # deny them outright so an injected/compromised script can't either.
    # Content-Security-Policy ships REPORT-ONLY first, on purpose.
    #
    # The policy below is derived from what the app actually needs, verified
    # against the source rather than guessed: 'wasm-unsafe-eval' + blob: for the
    # Draco decoder, blob: workers, 'unsafe-inline' styles because React writes
    # style attributes, and permissive media:/connect: because HA camera streams
    # and the websocket are reached over whatever scheme the instance uses.
    # frame-ancestors keeps the Ingress iframe working while blocking everyone
    # else.
    #
    # ⚠️ THIS PARAGRAPH NAMED "the two Google Fonts origins from index.html"
    # UNTIL 2026-08-21, and they were removed from BOTH the page and this header
    # in 2.504.0 — the fonts are self-hosted. `font-src 'self'` is the whole
    # story. A reader deciding whether to enforce would have gone looking for
    # two origins that are not there.
    #
    # ⚠️ ONE THIRD-PARTY SCRIPT IS REPORTED IN THE FIELD AND IT IS NOT OURS:
    # `static.cloudflareinsights.com/beacon.min.js`, injected into the HTML by
    # Cloudflare Tunnel on the way through. The bundle asks for nothing external
    # — which is what makes this policy enforceable — but ENFORCING it would
    # block that beacon, so anyone running the kiosk behind a tunnel should
    # expect that and want it: a villa with no WAN must work, and a script from
    # a third party is exactly what hard rule #2 exists to keep off this page.
    #
    # Report-Only because a wrong CSP bricks a kiosk that someone has to be
    # physically present to recover, and the cost of being wrong is far higher
    # than the delay in enforcing. Violations appear in the browser console:
    # load the kiosk on a phone and a laptop, exercise cameras/upload/3D, and if
    # nothing is reported, rename this single header to Content-Security-Policy
    # to enforce it. Shipping it Report-Only is what makes that test possible at
    # all — before this there was no policy to test.
    #
    # `blob:` IS in connect-src, and that is not decoration: the model is handed
    # to Babylon as a blob URL and its loader FETCHES that URL, so enforcing the
    # policy without it would have stopped the villa loading at all. The report
    # said so from a real device ("Connecting to 'blob:...' violates ...") —
    # which is the entire reason this header ships report-only first.
    #
    # ⚠️ THE GOOGLE FONTS ORIGINS ARE GONE (2.504.0). They were admitted for
    # "the two Google Fonts origins from index.html" — and index.html has not
    # referenced them for a long time: it preloads /fonts/jost-var.woff2 and
    # /fonts/public-sans-var.woff2, served by this add-on. So the policy was
    # permitting two third-party hosts for a page that never asks for them,
    # at the one place the offline hard rule could be MECHANICALLY enforced
    # rather than merely documented. Found during Phase 1 QA by checking the
    # comment against index.html instead of believing it.
    #
    # A `static.cloudflareinsights.com/beacon.min.js` violation is NOT ours to
    # allow: Cloudflare injects that script into proxied responses, and this
    # kiosk must work on a villa LAN with no internet. Leave it blocked; turn
    # Web Analytics off for the hostname instead.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: http: https:; connect-src 'self' blob: ws: wss: http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.home-assistant.io" always;

    # HSTS. nginx here only ever listens on plain HTTP (port 8099); TLS is
    # terminated upstream by Cloudflare (direct hostname) and by Home Assistant
    # (Ingress), and this header is forwarded to the browser from there. Safe to
    # send unconditionally: browsers IGNORE HSTS received over a non-secure
    # transport, so a LAN install reached over http is unaffected. No "preload"
    # — that is an irreversible commitment on a domain this add-on does not own.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Home Assistant Core API + websocket, via the token-injecting proxy.
    location /core/ {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # MJPEG camera streams + the websocket must not be buffered.
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Internal auth gate for the static /model/ route below. auth_request issues
    # a GET here carrying the original request's cookies; the proxy answers 200
    # (authorized) or 401. proxy_pass_request_body off — only the verdict matters.
    location = /auth/check {
      internal;
      proxy_pass http://127.0.0.1:8100/auth/check;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
    }

    # Vite emits content-hashed files under /assets — cache them hard.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Add-on options (model_path, sh3d_path) for the frontend.
    # Served by the supervisor-proxy so it can read /data/options.json.
    location = /addon-config {
      proxy_pass http://127.0.0.1:8100/addon-config;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
    }

    # Shared kiosk scenes (GET list / PUT replace), stored in the add-on's
    # /data volume by the supervisor-proxy so every device sees the same set.
    # Small JSON bodies — cap hard like the /auth/ routes below.
    location = /scenes {
      proxy_pass http://127.0.0.1:8100/scenes;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 1m;
    }

    # Shared DEVICE configuration (GET / PUT replace) — entity<->mesh bindings,
    # per-device metadata, rooms, device groups — stored in the add-on's /data
    # volume so every device is configured identically, same as the model and
    # scenes above. Bigger than scenes (one entry per entity + room polygons),
    # so a roomier cap; still bounded, and still well under the Supervisor
    # ingress proxy's own 16MB ceiling.
    location = /device-config {
      proxy_pass http://127.0.0.1:8100/device-config;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 8m;
    }

    # Facility Manager working set (schedules, completions, costs, tickets).
    location = /fm-data {
      proxy_pass http://127.0.0.1:8100/fm-data;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 4m;
    }

    # Evidence photos. The client downscales before sending, so the cap here is
    # headroom rather than a target — it exists so a raw phone photo posted by
    # mistake fails fast at the edge instead of streaming into the proxy.
    location /fm-evidence {
      proxy_pass http://127.0.0.1:8100/fm-evidence;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 4m;
    }

    # Client telemetry (POST one event / GET the ring). Tiny JSON bodies, and
    # the proxy bounds both the per-event size and the total ring — cap here
    # too so a bad client can't stream into it.
    location = /telemetry {
      proxy_pass http://127.0.0.1:8100/telemetry;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 128k;
    }

    # VESTA Reports: operator settings, the delivery record, and what this
    # deployment can analyse.
    #
    # ⚠️ THIS FILE IS AN EXPLICIT ALLOWLIST, NOT A CATCH-ALL. Every backend
    # endpoint needs its own `location` here or it falls through to `location /`
    # and is answered with the SPA's index.html — status 200, Content-Type
    # text/html, and a JSON parse error at the caller that says nothing about
    # the real cause. Adding a route to supervisor-proxy.py is HALF the change;
    # this is the other half, and the two are in different files with nothing
    # connecting them but this comment.
    #
    # One prefix block rather than three exact ones: the three paths share a
    # prefix and identical settings, so `location = ` three times would be three
    # places for the next endpoint to be forgotten. `/reports-` cannot collide
    # with the SPA's own routes, which are all bare paths.
    #
    # Cap matches /fm-data's intent: a reports config is a handful of schedules,
    # far smaller than the store's own 256 KB ceiling, so a body larger than
    # this is a bug or an attack and should fail at the edge rather than stream
    # into the proxy.
    location /reports- {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 1m;
    }

    # The agent's own endpoints. ⚠️ THE OPPOSITE SHAPE TO /reports- ABOVE, AND
    # THE DIVERGENCE IS THE POINT RATHER THAN AN INCONSISTENCY — the reasoning
    # that makes one prefix block right there is exactly what makes it wrong
    # here. See below.
    #
    # ⚠️ `/agent-mcp` IS DELIBERATELY NOT INCLUDED HERE AND MUST NOT BE. It is
    # the extraction seam for callers OUTSIDE this process, authenticating with
    # a bearer token rather than a session cookie; exposing it through Ingress
    # would put a tool-calling surface behind the kiosk's own cookie, so a
    # browser tab could drive the villa. `tests/py/test_nginx_routes.py` asserts
    # its ABSENCE here — the one route in the app checked in that direction.
    #
    # ⚠️ AND THAT IS WHY EVERY AGENT ROUTE BELOW IS AN EXACT `location =` RATHER
    # THAN ONE `/agent-` PREFIX BLOCK. A prefix block is the obvious way to
    # write five near-identical stanzas, and `/agent-mcp` STARTS WITH `/agent-`
    # — it would have been exposed by the tidier version of this file, silently,
    # with every test green because the route would then be reachable and the
    # positive check is all a prefix satisfies. One exact block per route costs
    # repetition and buys the property that adding an agent route does not
    # publish it by accident.
    location = /agent-config {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 1m;
    }

    location = /agent-concerns {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
    }

    location = /agent-chats {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
    }

    location = /agent-feedback {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 64k;
    }

    location = /agent-runs {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
    }

    location = /agent-audit {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
    }

    # ⚠️ A LONGER READ TIMEOUT, WHICH ITS /reports- SIBLING DOES NOT HAVE. A run
    # is several provider round trips with tool calls between them, and nginx's
    # 60s default would cut the connection while the work continued server-side
    # — so the operator sees a failure and the budget is spent anyway. (The
    # reports run-now route composes inline too and has only the default; that
    # looks like the same latent bug and is deliberately not changed here, on a
    # task about the agent's routes.)
    location = /agent-run-now {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      proxy_read_timeout 300s;
      client_max_body_size 64k;
    }

    # Profile passcode gate (roles + verify). Bodies are a tiny JSON object —
    # cap them hard so this can't be used to buffer arbitrary uploads.
    location /auth/ {
      proxy_pass http://127.0.0.1:8100;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 1k;
    }

    # Central model upload (GLB/SH3D) from the kiosk Settings UI. The proxy
    # writes the body into the HA www folder (atomic overwrite). The default
    # client_max_body_size (1m) would 413 the multi-MB GLB, so lift it here and
    # stream the body straight to the proxy instead of buffering it on disk.
    location = /model-upload {
      proxy_pass http://127.0.0.1:8100/model-upload;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-VK-Ingress $vk_ingress;
      client_max_body_size 200m;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    # Central 3D model files, served from the add-on's OWN persistent /data
    # volume (written by the /model-upload handler). No HA-config mount is
    # involved anymore, so the villa's floor plan is never exposed on HA's
    # unauthenticated /local/ static route.
    #
    # auth_request gates every fetch: the model is the villa's floor plan, so a
    # direct caller must hold a valid session cookie (Ingress-sourced requests
    # pass automatically — see /auth/check). On repeat opens the service worker
    # serves the GLB from its own cache, so this subrequest only runs on the
    # first, network-backed load — which happens after login, cookie in hand.
    # Cache-Control varies by ?v= presence — see the $model_cache_control map
    # above for why a single fixed value here broke re-upload cache-busting.
    location /model/ {
      auth_request /auth/check;
      alias /data/www/;
      add_header Cache-Control $model_cache_control;
      try_files $uri =404;
    }

    # Relative base + HashRouter means this fallback is rarely hit, but it keeps
    # any stray deep link resolving to the app shell.
    #
    # index.html is the ONLY unhashed file we serve: it references the
    # content-hashed /assets/index-*.js|css. Without a Cache-Control header
    # browsers/proxies (and the Nabu Casa / DuckDNS edge) apply heuristic
    # caching and keep serving a stale shell after an add-on update — so the
    # page loads OLD asset hashes and the UI never refreshes even though the
    # new build is on disk. Force revalidation of the shell on every load;
    # the hashed assets it pulls in stay immutable-cached (see /assets/).
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      # Repeated because nginx does not merge add_header across levels.
      add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: http: https:; connect-src 'self' blob: ws: wss: http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.home-assistant.io" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
