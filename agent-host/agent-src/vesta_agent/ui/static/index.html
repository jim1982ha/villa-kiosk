<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VESTA Agent</title>
<link rel="stylesheet" href="{static}/app.css">
<script src="{static}/errors.js"></script>
<script src="{static}/theme.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">VESTA</span><span class="eyebrow">Agent</span><span class="ver" title="{ver_title}">{ver}</span></div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="overview" class="on">{tab:overview}</button>
  <button role="tab" data-tab="rules">{tab:rules} <span class="tab-file" data-tab="rules-file" title="Open policy.yaml itself">(file)</span></button>
  <button role="tab" data-tab="knowledge">{tab:knowledge}</button>
  <button role="tab" data-tab="skills">{tab:skills}</button>
  <button role="tab" data-tab="costs">{tab:costs}</button>
  <button role="tab" data-tab="limits">{tab:limits}</button>
</nav>
<div id="pageerror" class="note alert pageerror" hidden></div>
<main id="view"></main>
<div id="savebar" class="savebar" hidden></div>
<div id="toast" class="toast" hidden></div>
<!-- the page's places (vesta_agent/places.py): every title and every "Rules › …" reads them; data, never run -->
<script type="application/json" id="places">{places}</script>
<script type="module" src="{static}/app.js"></script>
</body>
</html>
