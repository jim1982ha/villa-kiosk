# The reports: which sections, in which order, what they judge by, and the sentences the AI writes.
# Edit here (VESTA Agent page → Skills → reports): no release, no restart. A section left out of a
# report's list is not shown; reorder the list to reorder the page.
#
# ⚠️ NOTHING HERE NAMES ONE VILLA'S DEVICES. A villa adds its own playbook entries, cards and thresholds
# in `villa.reports.yaml` beside this file (VESTA Agent page → Skills → reports → New file): it is added
# to this one, and app updates keep it while they still update this file.

# ---------------------------------------------------------------- running
# When a device counts as running: the night check's and the energy figures' one rule (vesta_shared.daily), with
# this skill's own default. It is held equal in every skill (a test): to change it, set the villa helper
# input_number.vesta_on_threshold_fraction, which overrides it for every skill — not this file.
behaviour:
  on_threshold_fraction: 0.2   # an hour whose peak passes this share of the device's typical peak ran, for mean ÷ peak of it

# ---------------------------------------------------------------- judgements
thresholds:
  light:                       # the colour of a report, from the severities of what is open
    red: [P1]
    amber: [P2, P3]
  battery:                     # a battery's red "replace" / amber "watch" is the night check's finding, never judged here
    show: 8                    # the lowest N batteries are drawn
  # an equipment card is "Watch" when the one list names its device (the night check's findings, the clues)
  circuits_show: 8             # rows of the circuit table, largest first
  alert_follow_window_min: 15  # a logbook run this close to an incident of the same automation is that incident (shown once)
  circuit_change_max_pct: 300  # a change bigger than this (from almost nothing) shows as ">+300%", not "+10900%"
  todo:                        # the one list of what needs doing
    group_from: 3              # this many items of one kind become one line ("4 monitoring devices offline")
    same_time_minutes: 10      # a group whose items all started within this many minutes: one cause, says todo_groups.same_time
  card_days: 14                # days drawn in an equipment card
  trend_weeks: 10              # weeks drawn in the monthly electricity trend
  horizon:                    # preventive maintenance: when, from the finding's severity
    P1: Now
    P2: Now
    P3: Soon
    P4: Plan

# Settings this skill no longer reads (owner, 2026-10-19: "the night check owns each number asked twice"): a villa's
# villa.reports.yaml that still sets one is named in the report's problems, never silently ignored.
retired:
  thresholds.pump.watch_drop_pct: "an equipment card is Watch when the night check finds its running power changed (preventive-maintenance drift_pct)"
  thresholds.battery.replace_below_pct: "a battery's replace / watch is the night check's (preventive-maintenance battery_warn_pct, battery_crit_pct)"
  thresholds.battery.watch_below_pct: "a battery's replace / watch is the night check's (preventive-maintenance battery_warn_pct, battery_crit_pct)"
# The same for a playbook entry's `when` kind.
retired_kinds:
  power_step: "a pump's running power that dropped is the night check's finding (preventive-maintenance drift_pct)"
  battery_trend: "a falling battery is the night check's finding (preventive-maintenance battery_trend_*)"

# Families whose devices count for "devices offline". Which are critical is the villa's one list: its "critical
# devices offline" check (owner, 2026-10-18; the knowledge pack's is_critical), no family makes a device critical.
offline_families: [power, energy, battery, security, level, network, runtime]

# "What would help": a gap is shown when its condition holds for this villa.
gaps:
  - when: {unmetered_pct_above: 50}
    gap: Most of the electricity is not metered
    unlocks: The report can say where the electricity goes, and how much of it is avoidable.
  - when: {family_missing: water}
    gap: No water meter
    unlocks: Leaks and night-time flow can be measured.
  - when: {family_missing: level}
    gap: No tank or pool level sensor
    unlocks: A pump running dry is seen before it stops.

# Extra cards for this villa's own devices (none shipped; the villa's go in villa.reports.yaml). Kinds:
#   sensor_daily_max | sensor_daily_mean | energy_daily
# e.g.  - {kind: sensor_daily_max, entity: sensor.<your cabinet temperature>, title: Electrical cabinet,
#          unit: "°C", alert_at: 70}
cards: []

# Sections that need a calculation not agreed yet: shown as "not measured yet".
not_measured_yet:
  money: "Money left on the table: the avoidable energy (an AC on in an empty room, lights left on) is not measured yet."
  standby: "Night standby of the whole villa, not measured yet."
  uptime: "Monitoring uptime, not measured yet."

# ---------------------------------------------------------------- the playbook
# The situations the agent can recognise in the villa's data. `when` is checked by facts.py: each match
# is a CLUE handed to the AI with the entry. The other fields are for the AI's reading: what to look at
# in Home Assistant to confirm and explain it, what it usually means, what to check on site, what to ask,
# when to act and what ignoring it costs. Placeholders in {braces} come from the clue.
# The villa adds its own entries (its pool, its onsen, its cabinet...) in villa.reports.yaml.
# An entry without `when` is knowledge only: no clue, but the AI reads it with the clues (for what
# no figure shows yet, e.g. "the onsen pump's power slides for two hours before it runs dry").
#   when kinds:  run_change {change_pct, min_days, days, min_hours}  a motor's hours of running per day change
#                offline {families}                            a watched device not answering now
#                use_while_empty {mode_entity, empty, days}    electricity used while the villa is empty
# A pump's running power that dropped and a falling battery are not clues: the night check finds them (its
# PM-POWER-CHANGE, PM-BATTERY-* findings), and they reach the one list as open problems.
playbook:
  pumps:
    - name: running time changed
      title: "{subject}: {hours_before} h a day before {change_date}, {hours_after} h since"
      when: {kind: run_change, change_pct: 30, min_days: 3, days: 30, min_hours: 2}
      look_at: "the pump's hours of running per day, its timer or schedule helper, the logbook for who changed it"
      means: "a timer changed, a float switch, or a pump stopping early (dry run, overheating)"
      check: "the timer and its schedule, the supply and the breaker, signs of overheating"
      ask: "was the timer changed on purpose?"
      horizon: "Soon"
      cost_of_ignoring: "a pump that stops early leaves the water untreated; one that runs longer costs electricity"
  locks_and_doors:
    - name: a safety device offline
      title: "{subject} offline since {since}"
      group_title: "{n} safety devices offline"
      when: {kind: offline, families: [security]}
      look_at: "its history over the last days, its battery, its last change"
      means: "a lock or a sensor no automation can see: often a battery or a radio drop"
      check: "its battery, then a reset; if it stays offline, it needs re-pairing"
      ask: "does it still work by hand (key, keypad)?"
      horizon: "Now"
      cost_of_ignoring: "the unlocked-door and intrusion automations are blind for this door"
  energy_and_occupancy:
    - name: electricity used while the villa is empty
      title: "Electricity used while the villa was empty: {kwh_per_empty_day} kWh a day"
      when: {kind: use_while_empty, mode_entity: binary_sensor.villa_empty, empty: ["on"], days: 10}   # the villa's one "empty" (2026-10-18)
      look_at: "the main meter per hour on empty days, which circuits ran, lights and air conditioning left on"
      means: "something left on, or a load that should be off when nobody is there"
      check: "what was left on, and whether a scene or automation should switch it off when the villa is empty"
      ask: "was anyone in the villa on those days?"
      horizon: "Soon"
      cost_of_ignoring: "paid every empty day until it is found"
  monitoring:
    - name: a device of the monitoring offline
      title: "{subject} offline since {since}"
      group_title: "{n} monitoring devices offline"
      when: {kind: offline, families: [power, energy, battery, level, network, runtime]}
      look_at: "when it stopped answering, its battery or power, the Wi-Fi of its area"
      means: "a reading the report and the automations no longer have"
      check: "its power or battery, its network"
      horizon: "Soon"
      cost_of_ignoring: "the problems it would have shown go unseen"

# The one list's grouped lines: only a kind with a group line is grouped (a playbook entry's group_title,
# or an open task's rule here) — several devices offline at once share a cause; four pumps that each lost
# power are four problems, each its own line. {n}: how many; {since}: when they started, for same_time.
todo_groups:
  PM-SILENT: "{n} sensors have not reported"
  PM-UNAVAILABLE: "{n} devices offline"
  PM-RECONNECT-LOOP: "{n} devices keep dropping off the network"
  same_time: "All since {since}: one cause is likely (a restart, an integration, a hub or the network), not {n} separate faults."

# The VESTA rules whose every run IS an alert (they run only once their condition has held): their runs
# in Home Assistant's logbook count as alerts for the times the agent was not listening. Not the others:
# a schedule rule runs every day to check, a presence rule mostly stops at its conditions; their alerts
# come from the agent's own record (the event they raise when they alert).
# A rule's "villa became empty / someone came in" second look (its "When this rule runs" choice) stops in its
# CONDITIONS when it finds nothing, so it leaves no run in the logbook; a run it starts is an alert (2026-10-20).
alert_on_every_run: [critical_condition]
# ...except a run started by the villa's system itself: such a rule re-checks its condition each time the rules are
# reloaded or the system starts, and stops at once when it does not hold (villa, week 42: 400 such re-checks were
# counted as "critical alerts" — the rules had been reloaded 57 times, and none had alerted). The words are what the
# logbook gives as a run's start (its `source`), exactly: "event 'automation_reloaded'" for a reload; a start is
# written in words, not as an event (week 42 again: seven "alerts" at the restart of 17 Oct, 16:59).
not_an_alert_when_started_by:
  - "event 'automation_reloaded'"
  - "event 'homeassistant_start'"
  - "event 'homeassistant_started'"
  - "Home Assistant starting"

# What became of an alert, in the alerts table: per state the alert desk gives an incident. A state with no
# words here is named in the report's problems, never shown raw.
incident_words:
  new: Received
  asked: The facility manager was asked
  reasked: Reminder sent
  escalated: Escalated to the owner
  done: Done
  resolved: Cleared
  abandoned: Stopped being watched
  digest: In the morning digest
  logged: Recorded
  muted: Muted (before Mute was removed)
  recovered: Back to normal

# A VESTA rule in the alerts table: per blueprint, the words for an alert it SENT. {subject}: the rule's
# name after its blueprint prefix ("critical_schedule---garden_pump" → "Garden pump").
alert_words:
  critical_binary_trip: "{subject} tripped"
  critical_presence_guard: "{subject}"
  critical_condition: "{subject}"
  critical_watchdog: "{subject}: a watched device lost"
  critical_schedule: "{subject} did not run as scheduled"
  critical_system: "{subject}"

# What "nothing else happened" says: per VESTA rule blueprint (alert-desk), the sentence when it did not fire.
nothing_happened:
  critical_binary_trip: no leak or electrical trip
  critical_presence_guard: no intrusion while the villa was empty
  critical_condition: no door left unlocked and no supply left open
  critical_watchdog: no critical device lost
  critical_schedule: no equipment missed its schedule
  critical_system: no safety automation switched off
# ...and when some rules of a blueprint watch only part of the time ("When this rule runs", owner 2026-10-20): the line
# says so, never "no door left unlocked" for the hours a rule did not watch
nothing_happened_scope:
  empty: "(watched only while the villa is empty)"
  occupied: "(watched only while someone is in)"
  mixed: "(some of these automations watch only while the villa is empty, or only while someone is in)"

# ---------------------------------------------------------------- the reports
# Each section: `id` (its part of templates/report.html, `{% elif sid == "<id>" %}`), `style` if it has
# several (todo: the weekly's task list, or `plan` for the monthly's), and the sentences the AI writes for
# it: `write` (one for the section) or `write_each` (one per item: a line of the list, a card). A sentence is a
# READING (marked "VESTA's reading", the AI's own numbers) unless the slot says `checked: true`: then
# compose.py refuses it if a number in it is not one of the section's figures.
reports:
  fm-weekly:
    eyebrow: VESTA · Facility manager · Weekly
    period: week
    sections:
      - id: header
      - id: headline
        write: >-
          One or two sentences for the facility manager: what needs them this week and why, from the list
          and the alerts — the conclusion, not a list. The coloured light above your sentence is computed
          from what is open: agree with it, never call the week quiet or green when it is not. Say that
          everything else ran normally only if it did.
      - id: kpis
      - id: todo
        write_each:
          reading: >-
            What was seen, with your numbers and dates from the villa's records, and what it most likely means:
            one or two sentences. For a grouped line, the common cause if the data shows one.
          check: "What to check or do on site, concrete, from the playbook entry."
          ask: "The question to the facility manager, if the entry has one, with the date filled in."
      - id: alerts
      - id: quiet
        write: >-
          One sentence: what did not happen this week (from the list), and how many safety automations were on.
      - id: equipment
        write_each:
          reading: "One line under the chart: what changed and when, or that it was steady, and what that means."
      - id: batteries
        write: "One line: which battery is next to replace and roughly when."
      - id: energy_days
      - id: circuits
      - id: monitoring
      - id: footer
  owner-monthly:
    eyebrow: VESTA · Owner · Monthly proof
    period: month
    sections:
      - id: header
      - id: hero
        write: >-
          Two or three sentences for the owner: what the month cost, how many incidents and whether they were
          handled, and the one thing that needs a look — a judgement, as a property manager would write it.
      - id: kpis_month
      - id: happened
      - id: quiet
        write: "One sentence: what did not happen this month, and how many safety automations were on."
      - id: money
      - id: fixed_suggest
      - id: todo
        style: plan
        write_each:
          reading: "What it is and what it means for the owner: one sentence, with the cost of ignoring it."
          when: "When to act, in two or three words: this week, by a date, a month, a year."
      - id: trends
        write_each:
          reading: "One line under the chart: the trend and anything that stands out, and why it matters."
      - id: monitoring
      - id: gaps
      - id: footer
