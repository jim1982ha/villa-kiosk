description: The facility manager's daily digest and weekly page, the owner's weekly lines and monthly proof (HTML pages)
scripts:
  facts.py:                    # every figure of a weekly or monthly page (sections and thresholds: reports.yaml)
    commands: [fm-weekly, owner-monthly]
    flags: {--energy: infile, --out: outfile}
    inject: [pack, store, zone]
  compose.py:                  # the chat texts, and a page from its facts and your notes
    commands: [fm-daily, fm-weekly, owner-weekly, owner-monthly]
    flags: {--energy: infile, --facts: infile, --notes: infile, --as-of: date, --out: outfile}
    inject: [pack, store, zone]
schedule:
  - when: "07:00"
    prompt: >-
      It is 07:00. Read the reports skill, compose the facility manager daily digest (fm-daily) with
      run_skill_script, and send it to the fm chat with send_message, written in {fm_language}, keeping every
      number exactly as the script gave it. If there is nothing to report, send one short line saying the villa
      is quiet, so the facility manager knows the VESTA Agent is alive. No rule codes, no entity ids.
  - when: "Mon 08:00"
    prompt: >-
      It is Monday 08:00. Read the reports skill and make the facility manager's weekly page, following its
      steps "A weekly or monthly page": energy for the week, facts.py fm-weekly, your sentences in notes.json
      (in {fm_language}), compose.py fm-weekly, then send_message to fm with the page attached. Then send the
      owner the three owner-weekly lines (compose.py owner-weekly --energy week.json), in {owner_language}.
  - when: "1 08:00"
    prompt: >-
      It is the first of the month, 08:00. Read the reports skill and make the owner's monthly proof for last
      month, following its steps "A weekly or monthly page" (with the filtration optimiser and the proposals
      first, so the page carries them): energy for the month, facts.py owner-monthly, your sentences in
      notes.json (in {owner_language}), compose.py owner-monthly, then send_message to owner with the page attached.
