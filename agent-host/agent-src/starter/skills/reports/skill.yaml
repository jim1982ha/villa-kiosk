description: The facility manager's daily digest and weekly page, the owner's weekly lines and monthly proof (HTML pages)
# The tools a report's AI gets (among those switched on in Rules → What the AI can use): what VESTA's readings
# look at in Home Assistant, the notes it saves for compose.py, and the message that carries the page.
tools: [ha_get_state, ha_get_history, ha_search, ha_get_entity, ha_get_device, ha_eval_template, ha_get_logs,
        ha_get_automation_traces, ha_list_floors_areas, ha_get_overview, save_file, send_message]
scripts:
  facts.py:                    # every figure, and the clues, of a weekly or monthly page (reports.yaml)
    commands:
      fm-weekly: the weekly page's figures and clues
      owner-monthly: the monthly report's figures and clues
    job_only: {fm-weekly: fm-weekly, owner-monthly: owner-monthly}   # asked for in a chat: start_job, not here
    flags: {--energy: infile, --out: outfile}
    inject: [pack, store, zone]
  compose.py:                  # the chat texts, and a page from its facts and your notes
    commands:
      fm-daily: the facility manager's morning message
      fm-weekly: the weekly page, from its figures and the readings
      owner-weekly: the owner's three Monday lines
      owner-monthly: the monthly report, from its figures and the readings
    job_only: {fm-daily: fm-daily, fm-weekly: fm-weekly, owner-monthly: owner-monthly}
    flags: {--energy: infile, --facts: infile, --notes: infile, --as-of: date, --out: outfile}
    inject: [pack, store, zone]
# AI jobs: each `name` is the key of its model and spending limit in policy.yaml settings.jobs (VESTA
# Agent page → Rules → AI jobs); a job that policy.yaml does not name does not run. `default` is what
# the page offers when it adds the job. `on_limit` is the code step that still sends the page, with what
# is done, when the limit stops the job ({to}: here when asked in a chat, else the job's `to`).
schedule:
  - when: "07:00"
    name: fm-daily
    to: fm
    on_request: true
    description: the facility manager's daily digest (what is new since yesterday, what is still open)
    default: {profile: auto, limit_usd: 1}
    prompt: >-
      It is 07:00. Read the reports skill, compose the facility manager daily digest (fm-daily) with
      run_skill_script, and send it to the fm chat with send_message, written in {fm_language}, keeping every
      number exactly as the script gave it. If there is nothing to report, send one short line saying the villa
      is quiet, so the facility manager knows the VESTA Agent is alive. No rule codes, no entity ids.
  - when: "Mon 08:00"
    name: fm-weekly
    to: fm
    on_request: true
    description: the facility manager's weekly report (last week, or the week a person names)
    default: {profile: auto, limit_usd: 2}
    on_limit: "compose.py fm-weekly --facts facts.json --notes notes.json --out fm_weekly.html --finish {to} --since {started} --limit {limit}"
    prompt: >-
      It is Monday 08:00. Read the reports skill and make the facility manager's weekly report, following its
      steps "A weekly or monthly report": the week's energy, facts.py fm-weekly, your readings from the clues,
      the playbook and Home Assistant, saved in notes.json (in {fm_language}), compose.py fm-weekly, then
      send_message to fm with the page attached, its text the page's one-line summary. On schedule only, then send
      the owner the three owner-weekly lines (compose.py owner-weekly --energy week.json), in {owner_language};
      when the report was asked for in a chat, the page is the whole answer: send nothing else.
  - when: "1 08:00"
    name: owner-monthly
    to: owner
    on_request: true
    description: the owner's monthly report (last month, or the month a person names)
    default: {profile: performance, limit_usd: 6}
    on_limit: "compose.py owner-monthly --facts facts.json --notes notes.json --out owner_monthly.html --finish {to} --since {started} --limit {limit}"
    prompt: >-
      It is the first of the month, 08:00. Read the reports skill and make the owner's monthly report for last
      month, following its steps "A weekly or monthly report" (with the filtration optimiser and the proposals
      first, so the page carries them): the month's energy, facts.py owner-monthly, your readings from the
      clues, the playbook and Home Assistant, saved in notes.json (in {owner_language}), compose.py
      owner-monthly, then send_message to owner with the page attached.
