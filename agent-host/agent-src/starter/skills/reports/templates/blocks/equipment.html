<section>
  <h2>Equipment health</h2>
  <div class="grid2">
  {% for c in s.cards %}
    <div class="asset">
      <div class="t">{{ c.title }} <span class="st {{ 'watch' if c.status == 'Watch' else 'ok' }}">{{ c.status }}</span></div>
      <div class="s">{{ c.subtitle }}</div>
      {{ chart_line(c.series, c.unit, c.get("alert_at")) }}
      {% set r = reading(c.id ~ ".reading") %}{% if r %}<div class="s">{{ r }}</div>{% endif %}
    </div>
  {% else %}<p class="note">No equipment with a power meter.</p>{% endfor %}
  </div>
</section>
