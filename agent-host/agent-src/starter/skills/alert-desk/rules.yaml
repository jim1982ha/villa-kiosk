# Routing of alerts. A live vesta_critical_event names the VESTA rule's blueprint:
# it is matched first (`blueprint:`). Other alerts (the maintenance findings, the
# agent's own villa-silent watch) are matched by rule id prefix. First match wins.
# Severity: P1 owner and FM now, P2 FM now, P3 FM digest, P4 report only.
# cooldown_min: a repeat of the same rule on the same entity inside the cooldown
# is counted, not re-sent.
#
# Nothing here names a device. The entity comes with the event.

defaults:
  severity: P3
  cooldown_min: 60  # How long after an alert a repeat on the same device is counted, not sent again, for an alert whose kind below sets no time of its own.
  ladder: true          # Done / Need help with the chase (reask_minutes, then escalate_minutes)

routes:
  - blueprint: critical_binary_trip
    severity: P1
    cooldown_min: 30  # How long after a tripped-sensor alert (a water leak, for one) a repeat on the same device is counted, not sent again.
    check: "Go to the device named. If it is water, close the supply valve of that room and photograph the floor."
  - blueprint: critical_presence_guard
    severity: P1
    cooldown_min: 15  # How long after an alert of activity while the villa is empty a repeat on the same device is counted, not sent again.
    intrusion: true
    check: "Activity while the villa is marked empty. Look at the camera before anything else."
  - blueprint: critical_condition
    severity: P2
    cooldown_min: 120  # How long after an alert of a device in a wrong state a repeat on the same device is counted, not sent again.
    check: "Check the device named and put it right."
  - blueprint: critical_watchdog
    severity: P2
    cooldown_min: 240  # How long after an alert of a device that stopped answering a repeat on the same device is counted, not sent again.
    check: "Power and network of the device named, until it is back."
  - blueprint: critical_schedule
    severity: P2
    cooldown_min: 720  # How long after an alert of equipment that did not run as scheduled a repeat on the same device is counted, not sent again.
    check: "The equipment named did not run as scheduled: check its timer, breaker and supply."
  - blueprint: critical_system
    severity: P2
    cooldown_min: 720  # How long after an alert of a guarded automation found off or missing a repeat on the same device is counted, not sent again.
    check: "A guarded automation is off or missing after a restart. Switch it back on in the villa's system."
  - prefix: critical_internet
    severity: P1
    cooldown_min: 30  # How long after the villa-silent alert (no contact with the villa's system) a repeat is counted, not sent again.
    check: "Raised by the agent itself (villa silent). Check the power, the router and the internet link."
  - prefix: critical_
    severity: P2
  - prefix: maintenance_
    severity: P3
    cooldown_min: 1440  # How long after a maintenance alert of the villa's automations a repeat on the same device is counted, not sent again.
  - prefix: roi_
    severity: P4
    ladder: false
  - prefix: audit_
    severity: P4
    ladder: false
  - prefix: PM-
    severity: P3        # findings from the preventive-maintenance batch
    cooldown_min: 1440  # How long after a finding of the night check a repeat on the same device is counted, not sent again.

# A VESTA rule whose kind (blueprint) has no route above, and which names no priority itself: by its name — its
# entity id without "automation." — starting with `critical_`, else the rest (owner, 2026-10-19: "if the alert name
# has critical_ in its name: P1; if not, P2"). Its cooldown and chase are the defaults'.
# DECIDED, do not re-propose (owner, 2026-10-19): a route per rule ("Keep the same logic as before for the skill"),
# and a whole blueprint raised to P1 (critical_condition stays P2 by its route). A new kind gets a route above or
# this default, nothing else.
unrouted:
  critical_: P1
  other: P2

siren:
  # The siren never fires on a single signal. Two independent signals inside
  # the window, the villa empty, and one explicit human approval.
  window_min: 5  # How close together two independent signals must come for the siren to be proposed (the villa empty, and the owner approving).
  min_signals: 2  # How many independent signals inside the siren's window are needed; the siren never fires on a single one.
  # The villa's one "is it empty?" is the VESTA Kiosk's pick (Settings › Villa: on = empty, the sensor its presence
  # tile follows), handed to the agent at every heartbeat (vesta_shared.occupancy). No pick: never empty, no siren.
  # The human step is the owner's Approve button (the siren is an owner-only device in
  # policy.yaml); how long it sounds is policy.yaml's siren_auto_off_min.

# What a priority does to an alert — the one place (architecture review, 2026-10-19 evening): `chase` (the chase's
# asked role is asked to answer, reminded, then the owner told; with its task and Kiosk fault), `digest` (the next
# morning's list) or `log` (recorded only). A priority changed while its alert is open does what the new one says:
# raised to `chase`, the chase starts; lowered from it, the chase stops, its task and fault close, and every copy of
# its card says so (`lowered_words`, "{priority}" and "{time}" filled in).
priority_does:
  P1: chase
  P2: chase
  P3: digest
  P4: log
lowered_words:
  digest: "Lowered to {priority} on {time}: kept for the next daily digest. No reply needed."
  log: "Lowered to {priority} on {time}: recorded only. No reply needed."
# Raised back to `chase` after a lowering: the SAME task and Cockpit fault open again (one problem, one fault), the
# fault's reopening step saying this ("{priority}" filled in).
raised_words: "Raised to {priority}."

people_roles:
  # role -> which severities reach that chat: every message about an alert, from the first to its close
  owner: [P1]
  fm: [P1, P2]
  digest: [P3]
chase:
  asks: fm               # asked to answer (Done / Need help); also told every step of an alert they are chased for
  escalates_to: owner    # told when nobody answers, or when help is asked (the buttons go with it)
# The alert desk's timings (vesta_shared.params.behaviour): a villa helper input_number.vesta_<name> overrides
# one; a villa's own villa.rules.yaml may change them too (kept by updates). Moved here from the shared library.
behaviour:
  reask_minutes: 15            # How long the Facility Manager has to answer an alert before being asked again.
  escalate_minutes: 45         # How long after the Facility Manager was first asked, still with no answer, the owner is told.
  villa_silent_minutes: 30     # How long without contact with the villa's system before the villa is called silent (a P1 alert).
  alert_fatigue_per_month: 20  # An automation alerting more often than this, unanswered, is named as one to retune.
  reopen_hours: 4              # An alert that comes back within this long after its incident closed reopens it ("Back again") instead of starting a new one.
  clear_minutes: 10            # How long what an alert reported must stay gone before the alert is ended (read again every few minutes).
