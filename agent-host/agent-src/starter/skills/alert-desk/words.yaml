  es: "Sigue ahí: {count} veces desde {since}"
  it: "Ancora presente: {count} volte da {since}"
  nl: "Nog steeds: {count} keer sinds {since}"
  zh: "仍存在：自 {since} 起 {count} 次"
  ja: "継続中：{since} 以降 {count} 回"
  ko: "계속됨: {since} 이후 {count}회"

