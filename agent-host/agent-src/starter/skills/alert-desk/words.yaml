# ⚠️ ONE LINE ON A PHONE (owner, 2026-10-23): a closed alert stays on watch for rules.yaml `behaviour.reopen_hours`
# (the villa's value first): back within it, it reopens under the same number. Every end that can reopen says so,
# last ({watch}: that time, "1h", "30min"); a reopen_hours of 0 says nothing. "✅ Cleared on 22/10/2026 19:28: back
# to normal. Watch 1h." is the common line, 56 characters, what a phone's Telegram line holds
watch:
  en: "Watch {watch}."
  fr: "Surveillance {watch}."
  id: "Dipantau {watch}."
  de: "{watch} Beobachtung."
  es: "Vigilancia {watch}."
  it: "Sorveglianza {watch}."
  nl: "Bewaking {watch}."
  zh: "继续观察{watch}。"
  ja: "{watch}監視継続。"
  ko: "{watch} 동안 감시."

# ⚠️ THE WATCH ENDS, AND EVERY COPY SAYS SO (owner, 2026-10-25: "mention when/if the fault is fully cleared (and at
# what time)"): the closing line said "Watch 1h." and nothing came after it. {time}: the villa's time when shown;
# {watch}: the watch it ran ("1h"). The title then reads "(closed)" and the alert's text is struck.
watch_over:
  en: "Closed on {time}: it did not come back within {watch}."
  fr: "Clôturée le {time} : elle n'est pas revenue en {watch}."
  id: "Ditutup pada {time}: tidak muncul lagi dalam {watch}."
  de: "Geschlossen am {time}: innerhalb von {watch} nicht wiedergekommen."
  es: "Cerrada el {time}: no volvió en {watch}."
  it: "Chiusa il {time}: non è tornata entro {watch}."
  nl: "Gesloten op {time}: niet teruggekomen binnen {watch}."
  zh: "已于{time}关闭：{watch}内未再出现。"
  ja: "{time}に終了：{watch}以内に再発なし。"
  ko: "{time}에 종료: {watch} 안에 다시 발생하지 않음."

