    es: "Bajada a {priority} el {time}: solo registrada. No hace falta responder."
    it: "Abbassato a {priority} il {time}: solo registrato. Nessuna risposta necessaria."
    nl: "Verlaagd naar {priority} op {time}: alleen vastgelegd. Geen antwoord nodig."
