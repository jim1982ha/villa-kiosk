    fr: "Abaissée à {priority} le {time}: gardée pour le prochain résumé quotidien. Aucune réponse nécessaire."
    id: "Diturunkan ke {priority} pada {time}: disimpan untuk ringkasan harian berikutnya. Tidak perlu dibalas."
    de: "Herabgestuft auf {priority} am {time}: für die nächste Tageszusammenfassung vorgemerkt. Keine Antwort nötig."
    es: "Bajada a {priority} el {time}: guardada para el próximo resumen diario. No hace falta responder."
    it: "Abbassato a {priority} il {time}: tenuto per il prossimo riepilogo giornaliero. Nessuna risposta necessaria."
