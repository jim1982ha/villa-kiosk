# investigate — what happened, and why: a full account from the villa's records, a page with a short message.
# Run ONLY on its command (below): the AI is never offered it otherwise, so the line below is what the Agent page shows.
description: Investigates what happened and why — an incident, a fault, damage, a flood, a power cut, a device that stopped or behaved strangely, "check the logs/history", "what caused", "since when", "how long", "who or what turned it on". Answers with a short message and the full account as an HTML page (timeline, charts, likely causes, what would have warned earlier).

# ⚠️ ONLY BY ITS COMMAND (owner, 2026-10-11): the skill runs when a message carries /investigate — never otherwise.
# The AI does not see it among its skills, and its tools refuse it without the command.
command: investigate
# Its own brain and limit per answer (the Rules page's "Brain for chat answers" and "Limit per reply" stay for every
# other chat answer): an investigation reasons over many steps, the everyday Economy brain skipped some.
brain: auto
limit_usd: 3
# what the agent shows a person who sends /investigate alone
usage: "/investigate why did the water heater stop last night?"
# ⚠️ OFFERED FROM A CHAT (owner, 2026-10-19): a reply that tells the person to write /investigate carries this button;
# pressing it investigates the question they asked, exactly as typing "/investigate <their question>" would. Only a
# person who may write /investigate in that chat gets it.
# after_reading (owner, 2026-10-20: the reply about the House Pump skipped that line, and no button came): an answer
# whose turn read any of these — a device's past, its logbook — carries the button too, named or not.
offer:
  label: "🔎 Investigate this"
  pressed: Investigating
  # a button beside it that says no (owner, 2026-10-20: "add a button to reject the Investigation"): both go, nothing runs
  decline: "No, thanks"
  after_reading: [ha_get_history, ha_get_logs]
# ⚠️ EVERY HISTORY READ OF THE AI, WORKED OUT (owner, 2026-10-20: "I never want to see wrong responses"; a chat answer
# read the House Pump's 100 newest readings — 15 minutes at rest — as its whole afternoon): wherever the AI reads a
# device's history (a chat, a report), it gets this command's lines over the whole period, never raw readings.
reads_history: "investigate.py timeline --entities {entities} --start {start} --end {end}"
# Web research is part of EVERY investigation (owner, 2026-10-12: "always use web_search by default"): SKILL.md step 6.
# The page cannot be made without a web search where web search is available, nor without its sources cited.
# ⚠️ WHAT EVERY /investigate ANSWER CARRIES (owner, 2026-10-11: "always trigger the full use of the skill — HTML report in
# the response and buttons to create and cancel a ticket creation"), checked by the engine after the AI's turn:
#   page: the file the answer must have sent (send_message attachment). Missing: the AI is sent back once to make and
#         send it; still missing, the person is told plainly.
#   fault_offer: a Create / Don't create offer always comes. None made by the AI: the engine offers one, titled from
#         this file's "title", its note the "summary" (the account the skill saves).
deliver:
  page: investigation.html
  fault_offer: investigation.json

# The Home Assistant tools an investigation reads with (VESTA Agent page → Rules › AI tools).
# They limit nothing: who asks decides. The AI is told if one is switched off.
tools: [ha_search, ha_get_entity, ha_get_device, ha_get_state, ha_get_history, ha_get_logs,
        ha_get_automation_traces, ha_config_get_automation, ha_list_floors_areas, save_file, send_message,
        web_search]

scripts:
  investigate.py:
    description: Reads the villa's system for an investigation and returns short, checked facts (read-only)
    commands:
      find: the devices a word or a room means, and what sits next to them (same physical device, same room)
      timeline: what each device did in a period, as periods with times and levels, compared with its own normal
      around: everything else recorded then — automations, devices that stopped answering, notifications, VESTA alerts
    flags: {--what: text, --where: text, --entities: text, --start: date, --end: date, --baseline-days: text,
            --out: outfile}
    inject: [pack, store, zone]     # pack: a device's asset — its schedule (timeline), its device's entities (find)
  page.py:                     # this skill's own page (it was the reports skill's compose.py investigation)
    description: Makes the investigation's page from your account and the readings, and the short message that carries it
    flags: {--notes: infile, --data: infile, --around: infile, --out: outfile}
