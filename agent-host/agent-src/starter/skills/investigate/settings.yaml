# What the investigation counts as unusual, against each device's own normal (the days before). A villa's own
# villa.settings.yaml may change any of them (kept by updates). Moved out of the script (architecture review 32).
behaviour:
  # "Running" is the villa's one rule (the night check's, the energy figures', the weekly page's): an hour whose peak
  # passes this share of the device's typical peak ran. Keep it equal to the other skills' (a test holds them equal):
  # to change it for the whole villa, set the villa helper input_number.vesta_on_threshold_fraction instead.
  on_threshold_fraction: 0.2
  flat_spread: 0.5            # a device whose readings spread less than this share of its highest is read as levels, not runs
  longer_ratio: 2             # a run longer than this many times its longest normal one is flagged…
  longer_extra_s: 300         # …and longer than it by at least this
  level_high_ratio: 1.5       # a run drawing this many times its usual level is flagged
  level_low_ratio: 0.6        # …and one drawing less than this share of it
  offline_min_s: 60           # a device silent, without a value or reading exactly 0 (supply off) this long is flagged
  cycle_short_s: 180          # periods shorter than this, in a row, are stop-start cycling…
  cycle_min_runs: 3           # …when at least this many of them are runs…
  cycle_min_periods: 6        # …among at least this many periods
  ordinary_max_s: 3600        # an unflagged run or rest shorter than this is ordinary…
  ordinary_hide_over: 40      # …and not listed when a device has more periods than this
  level_change_ratio: 0.33    # a reading this share away from its level is a change of level…
  level_change_gap_s: 120     # …once it has lasted this long (and a run's level is judged only over this long)
  noise_per_hour: 30          # an entity changing more often than this an hour is background, not an event
  state_lane_max: 8           # an entity with more different states than this reports a value (a time, a text), not a state
  coincide_s: 600             # the page puts an event next to an unusual moment when it happened within this of it
  restart_settle_minutes: 10  # a device answering again within this of a Home Assistant restart was the restart's, not its own

# What the investigation says when the villa's system re-ran every rule itself — a reload of the rules, a start: ONE
# line for all of them (the moments and how many rule runs follow it), never "Automation “X” ran … check whether it
# did" per rule (architecture review round 2, 2026-10-19: one reload at 16:59 made 23 such lines). The investigation
# page says the same sentence in its log, at the first moment.
words:
  rules_reloaded: "The rules were reloaded: every rule ran once to re-check itself, none of them acted"
  system_started: "The villa's system started: every rule ran once to re-check itself, none of them acted"

# Settings this skill no longer reads: a villa's villa.settings.yaml that still sets one is told so in the
# investigation's answer (vesta_shared.skill_settings.retired), never silently ignored.
retired:
  behaviour.running_fraction: "running is the villa's one rule now, behaviour.on_threshold_fraction (or the villa helper vesta_on_threshold_fraction)"
  behaviour.high_quantile: "running is the villa's one rule now, behaviour.on_threshold_fraction (or the villa helper vesta_on_threshold_fraction)"
  behaviour.running_min: "running is the villa's one rule now, behaviour.on_threshold_fraction (or the villa helper vesta_on_threshold_fraction)"
