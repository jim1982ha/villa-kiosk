# What the investigation counts as unusual, against each device's own normal (the days before). A villa's own
# villa.settings.yaml may change any of them (kept by updates). Moved out of the script (architecture review 32).
# How the AI reads the records for an investigation (SKILL.md names them; the AI is given their values).
guide:
  lookback_days: 7            # When a question names no date, how many days back the investigation starts.
  lead_hours: 2               # How long before the first sign of trouble the investigation starts reading.
  web_searches_max: 5         # The most web searches one investigation may make.
behaviour:
  # "Running" is the villa's one definition (the night check's, the energy figures', the weekly page's): an hour whose peak
  # passes this share of the device's typical peak ran. Keep it equal to the other skills' (a test holds them equal):
  # to change it for the whole villa, set the villa helper input_number.vesta_on_threshold_fraction instead.
  on_threshold_fraction: 0.2
  flat_spread: 0.5            # A device whose readings vary less than this share of its highest reading is read as steady levels (a temperature), not as runs.
  longer_ratio: 2             # A run is flagged as too long when it lasts this many times its longest normal run, and also beyond it by the extra time for a long run.
  longer_extra_s: 300         # The extra time a run must last beyond its longest normal run, besides being that many times longer, to be flagged as too long.
  level_high_ratio: 1.5       # A run drawing this many times its usual level is flagged as drawing too much.
  level_low_ratio: 0.6        # A run drawing less than this many times its usual level (0.6 is 60%) is flagged as drawing too little.
  offline_min_s: 60           # A device silent, without a value, or reading exactly 0 (its supply off) for this long is flagged.
  zero_rest_share: 0.05       # A device that read exactly 0 for this share of the time on the days before rests at 0: its 0 means resting, not "no power" (a pump idling between 0 and 1.2 W).
  rest_high_share: 0.02       # A device at rest is flagged when it reads above its usual rest by this share of the gap up to its running level, for as long as a change of level must last (a pump drawing 37 W between runs instead of 1 W).
  starts_ratio: 3             # A device is flagged as starting far more often than usual when it starts this many times more often than in the same hours before, and at least the fewest starts set for it.
  starts_min: 6               # The fewest starts a device must make, besides starting that many times more often, to be flagged as starting far more often than usual.
                              # (the same two say "far more often" for a state: a door opened, a switch turned on)
  level_band_margin: 0.25     # A level beyond its usual highest or lowest of the same hours by this share of their spread is flagged (a room 6 °C warmer than on the days before).
  rise_ratio: 3               # A counter (energy) rising this many times faster or slower than in the same hours before is flagged.
  cycle_short_s: 180          # Periods shorter than this, one after another, count as stop-start cycling when enough of them are runs among enough periods.
  cycle_min_runs: 3           # How many runs a row of short periods must hold to count as stop-start cycling.
  cycle_min_periods: 6        # How many short periods in a row are needed to count as stop-start cycling.
  ordinary_max_s: 3600        # A run or rest that is not flagged and lasts less than this is ordinary: a busy device's ordinary periods are not listed.
  ordinary_hide_over: 40      # When a device has more periods than this, its ordinary runs and rests (short and not flagged) are not listed.
  level_change_ratio: 0.33    # A reading this share away from the device's level is a change of level, once it has lasted as long as a change of level must.
  level_change_gap_s: 120     # How long a different reading must last to count as a change of level (a run's level is also judged only over this long).
  burst_run_short_ratio: 0.67 # In a burst of runs, a run shorter than this share of the usual run is called "shorter", and one as much longer is called "longer".
  days_context: 14           # How many days of a measuring device's daily average an investigation shows with its readings.
  days_context_min: 4         # How many of those days must come before the device's normal days for its daily averages to be shown and compared.
  days_change_ratio: 3        # A measuring device's recent days are flagged when their daily average is this many times above, or below, the days before them.
  noise_per_hour: 30          # A device changing more often than this is background noise, not an event.
  state_lane_max: 8           # A device with more different states than this reports a value (a time, a text), not a state.
  coincide_s: 600             # How close in time an event must be to an unusual moment for the investigation page to show them side by side.
  restart_settle_minutes: 10  # A device answering again within this long of a restart of the villa's system came back because of the restart, not on its own.

# What the investigation says when the villa's system re-ran every rule itself — a reload of the rules, a start: ONE
# line for all of them (the moments and how many rule runs follow it), never "Automation “X” ran … check whether it
# did" per rule (architecture review round 2, 2026-10-19: one reload at 16:59 made 23 such lines). The investigation
# page says the same sentence in its log, at the first moment.
words:
  rules_reloaded: "The automations were reloaded: every automation ran once to re-check itself, none of them acted"
  system_started: "The villa's system started: every automation ran once to re-check itself, none of them acted"
  # a rule's "When this rule runs" choice (owner, 2026-10-20), said after what it is able to do
  runs_when_empty: "it alerts only while the villa is empty"
  runs_when_occupied: "it alerts only while someone is in"

# Settings this skill no longer reads: a villa's villa.settings.yaml that still sets one is told so in the
# investigation's answer (vesta_shared.skill_settings.retired), never silently ignored.
retired:
  behaviour.running_fraction: "running is the villa's one definition now, behaviour.on_threshold_fraction (or the villa helper vesta_on_threshold_fraction)"
  behaviour.high_quantile: "running is the villa's one definition now, behaviour.on_threshold_fraction (or the villa helper vesta_on_threshold_fraction)"
  behaviour.running_min: "running is the villa's one definition now, behaviour.on_threshold_fraction (or the villa helper vesta_on_threshold_fraction)"
