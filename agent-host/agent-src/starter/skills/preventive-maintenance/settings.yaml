# The night check's thresholds (vesta_shared.params.behaviour): they shape how a finding is confirmed and carry no
# physical meaning. A villa helper input_number.vesta_<name> overrides one; a villa's own villa.settings.yaml may
# change them too (kept by updates). Moved here from the shared library (architecture review 7, 2026-10-07).
behaviour:
  baseline_days: 30                     # window for the rolling median
  confirm_days: 2                       # consecutive days before a finding is raised
  drift_pct: 8                          # relative change of running power that counts
  energy_drop_pct: 60                   # daily kWh collapse versus baseline
  energy_rise_pct: 60                   # daily kWh jump versus baseline
  schedule_dev_pct: 25                  # run hours versus expected schedule
  sag_pct: 5                            # within-run power sag over one run
  min_days_for_baseline: 7
  battery_warn_pct: 20
  battery_crit_pct: 10
  battery_clear_margin_points: 5        # an open battery fault closes only above its level plus this (owner, 2026-10-20: a battery hovering at 20/21 % opened and closed all day)
  battery_level_window_hours: 24        # a battery is judged on its HIGHEST reading over these hours, its rested level (owner, 2026-10-21: a coin cell dips under load, a motion sensor read 1 % between two readings near 50 %); the villa's low-battery rule reads the same
  silence_hours: 24                     # a sensor that has not reported for this long
  unavailable_minutes: 10              # offline this long: its fault opens (the night check, and recheck.py every few minutes)
  back_online_minutes: 10               # a device found offline, back this long: its fault closes (recheck.py)
  on_threshold_fraction: 0.2            # fraction of running power that counts as "on", the villa's one definition, held equal in every skill: change it with the helper vesta_on_threshold_fraction
  on_threshold_floor_w: 1.0             # an asset with no data to judge from: "on" above this
  energy_gap_hours: 3                   # a meter's day with more hours missing is not judged
  silence_history_hours: 72             # how far back a quiet sensor's reporting is looked at
  silence_reporting_share: 0.5          # it reported in at least this share of the hours: then silence is news
  silence_min_history_hours: 48         # less history than this: too little to call it silent
  integration_down_devices: 3           # this many devices of one integration offline: the integration is down
  integration_down_window_minutes: 30   # ... gone within this many minutes of each other (three unrelated drops days apart are three devices)
  restart_settle_minutes: 10            # drops this close to a Home Assistant restart (its own "started" entry) are the restart's
  battery_trend_days: 14                # a battery's trend over these days
  battery_trend_min_points: 7           # with at least these readings
  battery_trend_drop_per_day: 0.5       # falling faster than this (points a day) is a trend
  battery_trend_warn_days: 14           # told when it would be empty within these days
  battery_low_fraction_of_nominal: 0.8  # a voltage battery below this share of its nominal is low
  worsened_step_pct: 15                 # an open finding worse by this many points is told again
  # (architecture review 4, 2026-10-13: these were typed in rules.py / nightly.py, out of a villa's reach)
  reconnect_days: 3                     # the logbook read for reconnect loops, and the window the check counts in
  reconnect_events: 10                  # this many drops in that window: a reconnect loop
  reconnect_min_drop_seconds: 10        # a drop back within this is the villa's system reloading its virtual devices, not a reconnect
  ran_min_hours: 0.1                    # a day an asset ran at least this long counts as a day it ran
  intermittent_share: 0.5               # an asset that ran on fewer than this share of its days is intermittent…
  intermittent_min_days: 3              # …or on fewer days than this
  full_day_hours: 20                    # a day with this many hours of data is judged against its schedule
  energy_baseline_min_kwh: 0.05         # a normal daily use below this is too small to judge a change against

# A fault of the night check's that a person reopened in the Cockpit ("Reopen fault"): who is told and under which
# title, by recheck.py within 5 minutes. `tell` is a role (fm, owner); the message's body is the one wording of a
# reopening ("Reopened in the Cockpit on … (Owner): Pump weak. Please look again."). The engine marks the reopening on
# the task; this skill tells it (an alert's reopening is the alert desk's, told through its own rules). A fault told on
# a night-check message is told THERE, a line of its Status section (`line`), the line before it struck — no separate
# message (owner, 2026-10-27); `tell` and `title` are for a fault no message told (a P3).
reopened_in_kiosk:
  tell: fm
  title: "Fault reopened in the Cockpit"
  # its line on the night check's message that told it ({time}: when, {who}: who reopened it)
  line: "⚠️ Reopened in the Cockpit at {time} by {who}"

# A P2 of this skill (a critical device offline, a battery at 10 %) is told to the facility manager at once; as it
# moves on, that SAME message says so — rewritten, never a new message (owner, 2026-10-20), one story as an alert's card
# tells it (architecture review N, 2026-10-27). `line`: added after the cleared item while the Cockpit watches it
# ({time}: the villa's time it cleared, {until}: the night check that ends the watch); `closed_line`: that night passed
# without it ({time}: the night check's); `back_line`: that night found it again; an item an alert took over shows the
# fault's close note ("Followed by alert #41, …"). `all_title`: the message's title once every item of it is back,
# closed or taken over ({title}: its own). `tell: false` leaves the messages as sent. A message Telegram no longer lets
# be rewritten stays.
told_cleared:
  tell: true
  line: "✅ Back to normal at {time}, watched until {until}"
  closed_line: "✅ Closed at {time}: it did not come back"
  back_line: "⚠️ Back again at {time}"
  all_title: "{title} All back to normal."
  # when the message cannot be rewritten (Telegram refuses, it was deleted, it was two pages): ONE reply to it, a line
  # per item that cleared — {time} when, {what} the item (owner, 2026-10-20: never a cleared P2 left unsaid)
  fallback: "✅ Back to normal at {time}: {what}"

# A fault of the night check's a person closed in the Cockpit while its problem was still there (owner, architecture
# review 2026-10-19: one rule with the alert desk's). The close holds until the device is read again — recheck.py
# within 5 minutes for the rules this skill reads again (skill.yaml `rechecks`), else the next night check — at least
# `minutes` after the close and still bad: the fault opens again ("Still there after the close."), said on the night
# check's message that told it (`line`, a line of its Status section, the one before it struck: no separate message,
# owner 2026-10-27); a fault no message told (a P3) is told once to `tell` (a role) under `title`, `words` its body —
# {done} where the close was given ("Done in the Cockpit", "Done on Telegram"), {when} the close's time, {what} the
# fault. `minutes` is the alert desk's clear_minutes (rules.yaml); without it a person's close holds.
still_there_after_close:
  minutes: 10
  tell: fm
  title: "Fault still there after the close"
  words: "{done} on {when}, but still there: {what}. Please look again."
  # its line on the night check's message that told it ({time}: when it was read still there)
  line: "⚠️ Still there after the close at {time}"
