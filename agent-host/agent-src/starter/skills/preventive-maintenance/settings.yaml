# The night check's thresholds (vesta_shared.params.behaviour): they shape how a finding is confirmed and carry no
# physical meaning. A villa helper input_number.vesta_<name> overrides one; a villa's own villa.settings.yaml may
# change them too (kept by updates). Moved here from the shared library (architecture review 7, 2026-10-07).
behaviour:
  baseline_days: 30                     # How many days the night check reads to learn each piece of equipment's normal (the middle value of those days).
  confirm_days: 2                       # How many days in a row a change must be seen before the night check raises a finding.
  drift_pct: 8                          # How much a piece of equipment's running power must change from its normal to count as a drift.
  energy_drop_pct: 60                   # How far a day's energy use must fall below its normal to be reported as a collapse.
  energy_rise_pct: 60                   # How far a day's energy use must rise above its normal to be reported as a jump.
  schedule_dev_pct: 25                  # How far a day's running hours may differ from the planned schedule before it is reported.
  sag_pct: 5                            # How much a piece of equipment's power may weaken during one run before it is reported.
  min_days_for_baseline: 7  # The fewest days of readings needed before a piece of equipment's normal is trusted and compared with.
  battery_warn_pct: 20  # A battery at or below this level is reported as low: replace within the week.
  battery_crit_pct: 10  # A battery at or below this level is reported as critical: replace now.
  # (owner, 2026-10-20: a battery hovering at 20/21 % opened and closed all day; owner, 2026-10-21: a coin cell dips
  # under load, a motion sensor read 1 % between two readings near 50 %)
  battery_clear_margin_points: 5        # An open battery fault closes only once the battery is this many points above its alert level, so a battery hovering at the limit does not open and close all day.
  battery_level_window_hours: 24        # A battery is judged on its highest reading over these hours, its level at rest, because a battery dips under load; the villa's low-battery automation reads the same.
  silence_hours: 24                     # A sensor that has not reported for this long is reported as silent.
  unavailable_minutes: 10              # How long a device must stay offline before its fault opens (checked each night and every few minutes).
  back_online_minutes: 10               # How long a device found offline must be back before its fault closes.
  on_threshold_fraction: 0.2            # fraction of running power that counts as "on", the villa's one definition, held equal in every skill: change it with the helper vesta_on_threshold_fraction
  on_threshold_floor_w: 1.0             # For equipment with no history to judge from, the power above which it counts as on.
  energy_gap_hours: 3                   # A meter's day missing more hours of data than this is not judged.
  silence_history_hours: 72             # How far back a quiet sensor's reporting is read to tell whether its silence is unusual.
  silence_reporting_share: 0.5          # A quiet sensor's silence is reported only if it reported in at least this share of the hours read before.
  silence_min_history_hours: 48         # A sensor with less history than this is too new to be called silent.
  integration_down_devices: 3           # How many devices of one integration (the link to one brand or system of devices) must go offline together for that integration to be reported as down.
  integration_down_window_minutes: 30   # How close together those devices must go offline to count as one integration down (three unrelated drops days apart are three devices).
  restart_settle_minutes: 10            # Devices dropping this close to a restart of the villa's system dropped because of the restart, and are not reported.
  battery_trend_days: 14                # How many days of a battery's levels are read to see whether it is falling steadily.
  battery_trend_min_points: 7           # The fewest daily readings a battery needs in those days before its trend is judged.
  battery_trend_drop_per_day: 0.5       # A battery falling faster than this each day is falling steadily.
  battery_trend_warn_days: 14           # A battery falling steadily is reported when it would be empty within this many days.
  battery_low_fraction_of_nominal: 0.8  # A battery reported in volts is low below this share of its nominal voltage.
  worsened_step_pct: 15                 # An open finding that gets worse by this many points is reported again.
  # (architecture review 4, 2026-10-13: these were typed in rules.py / nightly.py, out of a villa's reach)
  reconnect_days: 3                     # How many days of the logbook are read to find devices that keep dropping and reconnecting.
  reconnect_events: 10                  # How many drops within those days make a device's connection a reconnect loop.
  reconnect_min_drop_seconds: 10        # A drop that comes back within this is the villa's system reloading its virtual devices, not a reconnect.
  ran_min_hours: 0.1                    # A day on which a piece of equipment ran at least this long counts as a day it ran.
  intermittent_share: 0.5               # Equipment that ran on fewer than this share of its days is treated as running now and then, not every day.
  intermittent_min_days: 3              # Equipment that ran on fewer days than this is also treated as running now and then.
  full_day_hours: 20                    # A day needs at least this many hours of data to be judged against its schedule.
  energy_baseline_min_kwh: 0.05         # A normal daily use below this is too small to judge a change against.

# A fault of the night check's that a person reopened in the Cockpit ("Reopen fault"): who is told and under which
# title, by recheck.py within 5 minutes. `tell` is a role (fm, owner); the message's body is the one wording of a
# reopening ("Reopened in the Cockpit on … (Owner): Pump weak. Please look again."). The engine marks the reopening on
# the task; this skill tells it (an alert's reopening is the alert desk's, told through its own rules). A fault told on
# a night-check message is told THERE, a line of its Status section, as the alert card says it ("Reopened in the
# Cockpit on 11/10/2026 07:05 (Owner)", in the chat's language), the line before it struck — no separate message
# (owner, 2026-10-27); `tell` and `title` are for a fault no message told (a P3).
reopened_in_kiosk:
  tell: fm
  title: "Fault reopened in the Cockpit"

# A P2 of this skill (a critical device offline, a battery at 10 %) is told to the facility manager at once; as it
# moves on, that SAME message says so — rewritten, never a new message (owner, 2026-10-20), one story as an alert's card
# tells it (architecture review N, 2026-10-27). Each step is a line of its Status section as the alert card says it, in
# the chat's language: "Cleared on 11/10/2026 06:00: watched until 02:00.", "Closed on 12/10/2026 02:00: it did not
# come back.", "Back at 12/10/2026 02:00 (to: FM)"; an item an alert took over shows the fault's close note ("Followed
# by alert #41, …"). `all_title`: the message's title once every item of it is back,
# closed or taken over ({title}: its own). `tell: false` leaves the messages as sent. A message Telegram no longer lets
# be rewritten stays.
told_cleared:
  tell: true
  all_title: "{title} All back to normal."
  # when the message cannot be rewritten (Telegram refuses, it was deleted, it was two pages): ONE reply to it, a line
  # per item that cleared — {time} when, {what} the item (owner, 2026-10-20: never a cleared P2 left unsaid)
  fallback: "✅ Back to normal at {time}: {what}"

# A fault of the night check's a person closed in the Cockpit while its problem was still there (owner, architecture
# review 2026-10-19: one rule with the alert desk's). The close holds until the device is read again — recheck.py
# within 5 minutes for the rules this skill reads again (skill.yaml `rechecks`), else the next night check — at least
# the alert desk's clear_minutes (its rules.yaml, read there: one setting) after the close and still bad: the fault
# opens again ("Still there after the close."), said on the night check's message that told it (a line of its Status
# section as the alert card says it, the one before it struck: no separate message, owner 2026-10-27); a fault no
# message told (a P3) is told once to `tell` (a role) under `title`, `words` its body — {done} where the close was given
# ("Done in the Cockpit", "Done on Telegram"), {when} the close's time, {what} the fault.
still_there_after_close:
  tell: fm
  title: "Fault still there after the close"
  words: "{done} on {when}, but still there: {what}. Please look again."
