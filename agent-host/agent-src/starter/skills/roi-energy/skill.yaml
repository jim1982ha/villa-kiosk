description: Energy use and cost for a period, the pool filtration optimiser, and savings proposals
tools: []                     # its scripts read Home Assistant themselves
scripts:
  energy_period.py:
    flags: {--period: [week, month, custom], --start: date, --end: date, --no-cache: switch, --out: outfile}
    inject: [pack, store, zone]
  filtration_optimiser.py:
    flags: {--asset: text, --as-of: date, --out: outfile}
    inject: [pack, zone]
  proposals.py:
    flags: {--period-json: infile, --optimiser-json: infile, --out: outfile}
    inject: [store]
