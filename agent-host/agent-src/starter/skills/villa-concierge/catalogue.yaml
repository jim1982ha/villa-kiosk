# The closed action catalogue (the concierge's vocabulary). Inside the add-on the
# final word is /data/policy.yaml, checked by code on every call: an action this
# file allows and the policy refuses is refused. The agent can only do what is listed here, to
# the entity families listed, for the roles listed, and every action that
# changes the villa goes: propose -> human confirms -> call -> read back.
#
# States are absolute ("on", "locked"), never toggles: a toggle sent twice by
# a nervous user does the opposite of what they wanted.
#
# No entity id appears here. Targets are resolved at run time from the
# knowledge pack (family, area, asset). A new light in a new room is
# controllable the night it appears in the pack.

version: 1
confirmation_ttl_min: 15     # Fabien's brief, 29 September 2026
readback_timeout_s: 20       # how long to wait for the state to match

actions:
  light.on:
    families: [runtime]
    domains: [light, switch]
    roles: [owner, fm, tenant]
    confirm: true             # no physical action without approval (CLAUDE.md rule 1)
    service: {domain: light, service: turn_on}
    expect_state: "on"
  light.off:
    families: [runtime]
    domains: [light, switch]
    roles: [owner, fm, tenant]
    confirm: true
    service: {domain: light, service: turn_off}
    expect_state: "off"
  switch.on:
    families: [runtime]
    domains: [switch, fan]
    roles: [owner, fm]
    confirm: true
    service: {domain: switch, service: turn_on}
    expect_state: "on"
    forbid_assets_matching: ["siren", "relay"]   # the siren has its own path; relays feeding pumps are not chat toys
  switch.off:
    families: [runtime]
    domains: [switch, fan]
    roles: [owner, fm]
    confirm: true
    service: {domain: switch, service: turn_off}
    expect_state: "off"
    forbid_assets_matching: ["siren", "relay"]
  lock.lock:
    families: [security]
    domains: [lock]
    roles: [owner, fm]
    confirm: true
    service: {domain: lock, service: lock}
    expect_state: "locked"
  lock.unlock:
    families: [security]
    domains: [lock]
    roles: [owner]            # remote unlock is owner only, always confirmed, always logged
    confirm: true
    service: {domain: lock, service: unlock}
    expect_state: "unlocked"
  siren.on:
    families: [security]
    domains: [switch, siren]
    roles: [owner]            # owner only (Fabien, 29 September 2026)
    confirm: true
    via: alert-desk            # only the desk's gate may emit this action
    service: {domain: switch, service: turn_on}
    expect_state: "on"
    auto_off_min: 3
  siren.off:
    families: [security]
    domains: [switch, siren]
    roles: [owner, fm]
    confirm: false
    service: {domain: switch, service: turn_off}
    expect_state: "off"
  snapshot.get:
    families: [security]
    domains: [camera]
    roles: [owner, fm]
    confirm: false
    tool: ha_get_camera_image
  # A job for the facility manager is not an action here: it is a Facility ticket in the
  # VESTA Kiosk (the model's create_ticket tool).
  helper.set_number:
    roles: [owner]
    confirm: true
    domains: [input_number]
    allow_matching: ["_volume_m3", "_target_turnovers_per_day", "_rated_", "_drift_pct", "_max_c", "_max_humidity_pct", "_battery_nominal_v", "electricity_tariff_kwh", "villa_fx_idr_per_usd", "vesta_"]
    service: {domain: input_number, service: set_value}
  helper.set_text:
    roles: [owner]
    confirm: true
    domains: [input_text]
    allow_matching: ["_model", "_curve", "_window", "villa_", "vesta_"]
    service: {domain: input_text, service: set_value}
  helper.set_select:
    roles: [owner, fm]
    confirm: true
    domains: [input_select]
    allow_matching: ["villa_mode"]
    service: {domain: input_select, service: select_option}
  helper.set_datetime:
    roles: [agent]
    confirm: false
    domains: [input_datetime]
    allow_matching: ["vesta_last_run"]
    service: {domain: input_datetime, service: set_datetime}
  registry.set_area:
    roles: [owner]
    confirm: true              # answer to "which room?" for a new device
    tool: ha_set_entity
  automation.on:
    roles: [owner]
    confirm: true
    domains: [automation]
    service: {domain: automation, service: turn_on}
    expect_state: "on"
  automation.off:
    roles: [owner]
    confirm: true
    domains: [automation]
    service: {domain: automation, service: turn_off}
    expect_state: "off"
  maintenance_mode.set:
    roles: [owner, fm]
    confirm: true
    domains: [input_boolean]
    allow_matching: ["maintenance_mode"]
    service: {domain: input_boolean, service: turn_on}

never:
  - automation.trigger and automation.reload   (automation on/off: owner only, with approval, in policy.yaml)
  - climate.set_temperature                     (not until the AC is metered and a policy exists)
  - any service on an entity outside the knowledge pack
  - any registry write other than the area of a new device
  - any config_set_* tool of ha-mcp
