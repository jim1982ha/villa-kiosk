description: Answers about the villa's state (is everything OK? where is X?) and asks for actions, always by Approve / Refuse
# the tools the AI needs to talk about the villa (VESTA Agent page → Rules › AI tools)
tools: [ha_get_state, ha_get_history, ha_search, ha_get_entity, ha_list_floors_areas, ha_call_service]
scripts:
  concierge.py:
    commands:
      status: '"is everything OK?": the colour and the reasons'
      find: which devices a place or a name means
    flags: {--what: text, --where: text}
    inject: [pack, store, zone]
# Before every answer in a chat, the engine runs this and gives the AI its "text": the villa's status as it is now,
# so a question about it is never answered from a quick look or from memory.
before_answer: "concierge.py status"
on_event:
  # A Telegram voice message: its audio made ready, and the plan the engine runs in order until it has
  # words: Whisper asked directly (language "auto"), then the villa's speech-to-text in "auto", then in
  # {language} (which Whisper, which speech-to-text, a fixed language: villa.voice.yaml).
  voice_message: "voice.py prepare --audio {audio} --language {language}"
