description: Answers about the villa's state (is everything OK? where is X?) and asks for actions, always by Approve / Refuse
# the tools the AI needs to talk about the villa (VESTA Agent page → Rules → What the AI can use)
tools: [ha_get_state, ha_get_history, ha_search, ha_get_entity, ha_list_floors_areas, ha_call_service]
scripts:
  concierge.py:
    commands:
      status: '"is everything OK?" — the colour and the reasons'
      find: which devices a place or a name means
    flags: {--what: text, --where: text}
    inject: [pack, store, zone]
on_event:
  # A Telegram voice message: its audio made ready for Home Assistant's speech-to-text
  # (which speech-to-text, which language: villa.voice.yaml). The engine sends it.
  voice_message: "voice.py prepare --audio {audio} --language {language}"
