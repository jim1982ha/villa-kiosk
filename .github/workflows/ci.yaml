# Every check (tools/release.py gates), once per change.
name: CI

# Runs once per change: build.yaml calls it before building the image (a red check publishes nothing), and a pull
# request runs it on its own. No push trigger: that ran every check a second time.
on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: kiosk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # 24: the tests import the shipped TypeScript directly (type stripping
          # and the alias hook in tests/consistency/, under `node --test`).
          node-version: "24"

      - name: Install
        # The committed lockfile exactly (the Dockerfile runs the same command).
        run: npm ci --no-audit --no-fund

      - name: The proxy's runtime dependency
        # The proxy tests import supervisor-proxy.py, which needs aiohttp (the
        # image installs it as an apk, py3-aiohttp).
        run: python3 -m pip install --quiet aiohttp

      - name: The gates
        # Listed once, in tools/release.py: the same command as `npm run gates`.
        run: python3 tools/release.py gates
