# The first automated gate this branch has had beyond `tsc -b` inside the image.
#
# ⚠️ dev2 SHIPPED TO PRODUCTION WITH ONE GATE, AND IT COULD NOT SEE THE PYTHON.
# Until 2.496.23 this directory held only `build.yaml`: the sole automated check
# on 55,000 lines of TypeScript, 2,073 lines of proxy and both hard rules was
# `RUN npm run build` in the Dockerfile. A syntax error in `supervisor-proxy.py`
# produced a GREEN BUILD and a container serving static HTML with no auth
# backend behind it, because nothing in the pipeline so much as parsed it.
#
# ⚠️ AND THE PINS THAT DID EXIST WERE INVISIBLE. Eighteen oracles sat in a
# `tests/` directory that `.gitignore` excluded wholesale — not tracked, so a
# fresh clone had none and CI had none. That is fixed in the same release; see
# `.gitignore`'s own note on why `tests/*` and not `tests/`.
name: CI

on:
  push:
    # ⚠️ `ai` IS HERE BECAUSE IT SHIPS AN ARTIFACT NOW. It carried commits with
    # no CI run at all until the AI layer landed on it — the gates below fired
    # only on a pull request or a manual dispatch, which is to say on nothing
    # that actually happened. A branch that publishes an installable image and
    # is not in this list is a branch whose gates are decorative.
    branches: [dev2, main, ai]
  pull_request:
  workflow_dispatch:
  # ⚠️ CALLABLE, SO THE IMAGE BUILD CAN DEPEND ON IT. Until this was added,
  # build.yaml and this file were two INDEPENDENT workflows on the same push
  # trigger: nothing in build.yaml referenced these checks, its GHCR step is an
  # unconditional `push: true`, and its manifest-sync job needs only `build`.
  # So a commit that reddened every gate below still published an image to GHCR
  # and still committed the manifest to main that makes Home Assistant offer
  # it. The iPad on the wall updated to a build whose gates had failed, and the
  # red X sat on a DIFFERENT workflow from the one that shipped.
  #
  # GitHub Actions has no cross-workflow `needs:`, so build.yaml calls this as
  # a reusable workflow and gates its own build job on the result. Every gate
  # in this file was advisory before that edge existed.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: kiosk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⚠️ 24, BECAUSE THE ORACLES IMPORT THE SHIPPED TYPESCRIPT DIRECTLY.
          # They run under plain `node` with type stripping and the repo's own
          # alias hook (tests/consistency/) rather than a test runner — which is
          # what makes them test the module that ships instead of a copy of it.
          node-version: "24"

      - name: Install
        # ⚠️ `npm install`, NOT `npm ci`, AND THAT IS WHY THIS FILE HAS A HISTORY
        # OF ZERO GREEN RUNS. Every CI run since 2.496.23 created this workflow
        # failed HERE, on `npm ci`, so not one of the seven gates below has ever
        # executed on a runner — eleven releases shipped while this file was
        # cited as their gate. `npm ci` succeeds in a clean local checkout of
        # the same lockfile, so the cause is the runner, not the lockfile.
        #
        # Matching the Dockerfile is also the point: one resolver on both paths
        # means a green build here says something about the image's build stage.
        run: npm install --no-audit --no-fund

      - name: Types and bundle
        # The gate that already existed, hoisted out of the image so it fails
        # in seconds rather than after a multi-arch build.
        run: npm run build

      - name: Oracles
        # Each pins a defect that was found, reproduced and fixed. `open/` holds
        # ones that fail BY DESIGN against known-open defects; run-all.sh
        # reports those separately and does not fail on them.
        run: npm run test:oracles

      - name: The two hard rules
        # ⚠️ THE HASH PATH IS THE ONLY ONE THAT EXISTS HERE. The plaintext token
        # list is gitignored, so `checkout` never produces it — which is how
        # this clause came to print SKIP and exit 0 on every runner for eleven
        # releases. `npm run test:hard-rules:ci` is the same command a developer
        # can run locally to exercise THIS branch rather than their own.
        run: npm run test:hard-rules:ci

      - name: The proxy's runtime dependency
        # ⚠️ WITHOUT THIS, THE NEXT STEP CANNOT EVEN IMPORT ITS SUBJECT.
        # supervisor-proxy.py does `from aiohttp import ...` at module scope and
        # proxy-rules.py EXECUTES the module (importlib, because the filename is
        # hyphenated). A bare runner has no aiohttp, so that gate failed on the
        # import and had never run in CI — the same as every other gate here,
        # which could not run at all until 2.496.34. The image installs the same
        # dependency as an apk (py3-aiohttp); this is CI's half of that fact.
        run: python3 -m pip install --quiet aiohttp

      - name: The proxy's security rules
        # ⚠️ THE FIRST TEST ON THIS BRANCH THAT REACHES THE PROXY AT ALL.
        run: npm run test:proxy

      - name: The path lists agree
        run: npm run test:routes

      - name: The add-on manifest agrees with what an operator reads
        # ⚠️ config.yaml PROMISED THIS GUARD AND IT DID NOT EXIST — its comment
        # beside the options block named a security_test.py that is not tracked
        # on this branch. A field missing from translations/en.yaml
        # renders on Supervisor's Configuration page as its raw key with no
        # help text, and that is the page where the PINs are set.
        run: npm run test:manifest

      - name: That gate is capable of failing
        # ⚠️ A GREEN GATE IS NOT A WORKING ONE. Two checks on this branch were
        # green for their whole lives — one printed SKIP and exited 0 on every
        # runner, one collapsed nine labels into a single set element. The step
        # above now covers a LIST of add-on manifests, so this breaks each of
        # its rules in turn and requires it to go red, with the right message,
        # for each. The sweep edits tracked files and restores them in a
        # `finally`; the checkout is ephemeral, so a hard kill mid-mutation
        # costs nothing.
        run: npm run test:manifest:mutations

      - name: The proxy parses
        # ⚠️ THE CHEAPEST CHECK HERE AND THE ONE WITH THE WORST FAILURE MODE.
        # Nothing else in this pipeline loads the proxy at all.
        run: npm run test:proxy-parse

  # ── The AI layer ──────────────────────────────────────────────────────────
  # ⚠️ A SECOND JOB, NOT A STEP IN THE FIRST. The two add-ons are different
  # artifacts with different languages, different images and independent
  # versions; a Python failure must be readable as a Python failure rather than
  # as "the kiosk job is red". The `kiosk` job above is untouched by this.
  ai-layer:
    name: ai-layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is the AI layer on this branch at all?
        id: present
        # ⚠️ WITHOUT THIS, THIS JOB BREAKS THE KIOSK'S RELEASE. `build.yaml`
        # calls this workflow to gate the kiosk image, and `dev2`/`main` carry
        # no `agent/` tree — so the moment this file is merged there, `pytest
        # agent/tests` exits 4 (nothing collected), the `checks` job fails, and
        # the KIOSK stops publishing. The hunk below claimed the kiosk job was
        # untouched by this; that was true of the job and not of the workflow.
        #
        # Not a silent skip: it prints which branch has what, and the steps
        # below are conditioned on it rather than on nothing.
        run: |
          if [ -d agent ] && [ -d agent/tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "the AI layer is on ${GITHUB_REF_NAME}; its gates run below"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no agent/ on ${GITHUB_REF_NAME} — this branch does not ship the AI layer, so there is nothing here to gate"
          fi

      - name: Install the test runner
        if: steps.present.outputs.present == 'true' 
        # ⚠️ pytest AND NOTHING ELSE. The layer's own test surface is entirely
        # async and deliberately takes no pytest-asyncio dependency — a four-line
        # hook in `agent/tests/conftest.py` runs the coroutines — and nothing
        # under test imports aiohttp at module scope, so a bare runner is enough.
        # Every dependency this job does not have is one that cannot be missing
        # the day it matters.
        run: python3 -m pip install --quiet pytest

      - name: The layer's tests
        if: steps.present.outputs.present == 'true'
        # Through the npm script, like every gate in the kiosk job — one command
        # a developer can run locally and CI runs identically.
        run: npm run test:agent

      - name: Those tests are capable of failing
        if: steps.present.outputs.present == 'true'
        # ⚠️ A GREEN SUITE IS NOT A WORKING ONE, AND THIS BRANCH HAS SHIPPED
        # SEVERAL THAT WERE GREEN FOR THEIR WHOLE LIVES. Every load-bearing
        # claim in `agent/` is broken in turn here — an unknown model priced at
        # zero, a half-failed connection rounding up to healthy, a dropped
        # socket ending the add-on — and the suite must go red for each.
        run: npm run test:agent:mutations

      - name: The layer starts, reports, and stops cleanly
        if: steps.present.outputs.present == 'true'
        # ⚠️ RUNNING THE ARTEFACT, NOT ONLY ITS UNITS. Every start test passed
        # against a fake whose `publish` could not fail, while the real add-on
        # raised out of start() and crash-looped before printing anything an
        # operator could read. This runs `python3 -m agent` with no Supervisor
        # to talk to — the state a fresh install is in — and requires it to come
        # up, say what it is missing, print the meter reading zero, and stop on
        # SIGTERM.
        run: |
          set -euo pipefail
          out=$(VESTA_AI_OPTIONS=/nonexistent/options.json \
                VESTA_AI_DATA="$RUNNER_TEMP/aidata" \
                VESTA_AI_VERSION=ci \
                timeout --signal=TERM 10 python3 -m agent 2>&1 || true)
          echo "$out"
          for expected in "vesta-ai ci starting" "not configured yet" \
                          "usd=0.0000" "vesta-ai stopped"; do
            echo "$out" | grep -qF "$expected" \
              || { echo "::error::the layer never printed: $expected"; exit 1; }
          done
          # ⚠️ `if`, NOT `grep ... && { exit 1; }`. Under `set -e` that compound
          # returns non-zero exactly when the grep finds NOTHING — so the step
          # failed on the good run and passed on the bad one. This repository
          # already has the lesson written down twice: never judge a run by a
          # grep's shape, judge it by an exit status you control.
          if echo "$out" | grep -q "Traceback"; then
            echo "::error::the layer raised on a path it must survive"
            exit 1
          fi
          echo "the layer came up, reported and stopped cleanly"
