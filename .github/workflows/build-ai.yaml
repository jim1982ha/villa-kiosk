name: Build & publish the AI layer

# Publishes per-arch images of the VESTA AI Layer to GHCR, then makes Home
# Assistant able to see them.
#
# ⚠️ TWO SEPARATE ARTIFACTS, TWO SEPARATE WORKFLOWS. `build.yaml` ships the
# kiosk from `main`/`dev2`; this ships the AI layer from `ai`. Branch `ai` does
# NOT rebuild or republish the kiosk — the kiosk keeps shipping from `dev2` —
# so nothing here reads `villa-kiosk/` and nothing in build.yaml reads
# `vesta-ai/`. One branch, one published artifact.
on:
  push:
    branches: [ai]
    paths:
      - "agent/**"
      - "vesta-ai/**"
      - "Dockerfile.ai"
      - "rootfs-ai/**"
      - ".github/workflows/build-ai.yaml"
      # ⚠️ THE GATE WORKFLOW IS AN INPUT TO THIS BUILD. `checks` calls ci.yaml,
      # so a commit that changes only the gates must re-run the thing they gate
      # — otherwise a fix to a failing gate cannot produce the image the failing
      # gate blocked, and the only way forward is a manual dispatch.
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ⚠️ THE GATES RUN FIRST AND THE IMAGE WAITS FOR THEM. GitHub Actions has no
  # cross-workflow `needs:`, so an image build that merely shares a trigger with
  # the test workflow is not gated by it at all — a commit that reddened every
  # check would still publish, and the red X would sit on a different workflow
  # from the one that shipped. That happened on the kiosk side; build.yaml calls
  # ci.yaml for exactly this reason, and so does this.
  checks:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: meta
        run: |
          version=$(grep -E '^version:' vesta-ai/config.yaml | head -1 | sed -E 's/.*version:[[:space:]]*"?([^"]+)"?.*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # ⚠️ THE CHANNEL SUFFIX AND THE `:latest` GUARD ARE BOTH MANDATORY,
          # AND THEY ARE NOT COPIED FROM THE KIOSK'S BRANCH NAMES. What the
          # kiosk's guards actually say is: a branch that is not this artifact's
          # RELEASE branch must never write this artifact's released tags. For
          # the AI layer that release branch is `ai` — it is the only branch that
          # builds this image at all — so `ai` publishes `vesta-ai-<arch>` and
          # anything else gets a suffix and no `:latest`. Writing `main` here
          # instead would give every future experiment branch the released name.
          suffix=""
          if [ "${GITHUB_REF_NAME}" != "ai" ]; then suffix="-${GITHUB_REF_NAME}"; fi
          image="ghcr.io/${owner}/vesta-ai${suffix}-${{ matrix.arch }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          tags="${image}:${version}"
          if [ "${GITHUB_REF_NAME}" = "ai" ]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          {
            echo "tags<<__TAGS__"
            echo "$tags"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ai
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
          cache-from: type=gha,scope=ai-${{ matrix.arch }}
          cache-to: type=gha,scope=ai-${{ matrix.arch }},mode=max

  # ── Make Home Assistant able to see it ────────────────────────────────────
  # ⚠️ WITHOUT THIS JOB THE ADD-ON DOES NOT EXIST AS FAR AS ANY USER IS
  # CONCERNED. Supervisor reads add-on manifests from the repository's DEFAULT
  # BRANCH and nowhere else — it has no idea `ai` exists — so an image published
  # from here is invisible in the add-on store until a manifest describing it
  # appears on `main`. This is the same mechanism as the kiosk's
  # `chore(dev2-channel):` commits, and it is why those exist.
  #
  # It is a STRAIGHT COPY, unlike the kiosk's channel sync: `vesta-ai/` does not
  # exist on main, so there is no name, slug or image field to patch. It touches
  # `vesta-ai/` only and never `villa-kiosk/` or either generated channel.
  sync-ai-manifest:
    if: github.ref_name == 'ai'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialised: two pushes landing together would both try to push main.
    # Not `cancel-in-progress` — a cancelled sync leaves the add-on a version
    # behind with nothing to retry it.
    concurrency:
      group: sync-ai-manifest
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialise vesta-ai/ from ai
        run: |
          set -euo pipefail
          git fetch origin ai
          rm -rf vesta-ai && mkdir -p vesta-ai
          git archive origin/ai vesta-ai | tar -x --strip-components=1 -C vesta-ai
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 - <<'CHECK'
          import sys, yaml
          d = yaml.safe_load(open("vesta-ai/config.yaml"))
          assert d["slug"] == "vesta_ai", d.get("slug")
          # ⚠️ THE PERMISSIONS ARE CHECKED AT PUBLISH TIME, NOT ONLY IN REVIEW.
          # `hassio_api` or a `hassio_role` appearing in this manifest would
          # hand a suggest-only layer the ability to start, stop and install
          # add-ons. ADR-0012 rules it out; this is what makes that enforceable
          # on the one path where it reaches a user.
          for forbidden in ("hassio_api", "hassio_role", "ingress", "ports"):
              assert forbidden not in d, f"{forbidden} must not be in this manifest"
          assert d["homeassistant_api"] is True
          print("ai manifest ok:", d["version"])
          CHECK

      - name: Commit if changed
        run: |
          set -euo pipefail
          # ⚠️ STAGE FIRST, THEN ASK THE INDEX. `git diff` does not see untracked
          # files, so on the run that CREATES vesta-ai/ it reports "no change",
          # exits 0 and commits nothing — a green tick on the one run that had to
          # work. `--all` also catches files deleted upstream.
          git add --all vesta-ai
          if git diff --cached --quiet -- vesta-ai; then
            echo "ai manifest already current — nothing to publish"; exit 0
          fi
          echo "publishing $(git diff --cached --name-only -- vesta-ai | wc -l) file(s):"
          git diff --cached --stat -- vesta-ai
          version=$(grep -E '^version:' vesta-ai/config.yaml | head -1 \
                    | sed -E 's/.*version:[[:space:]]*"?([^"]+)"?.*/\1/')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ai-channel): publish VESTA AI Layer ${version}"
          # main may have moved (a kiosk release, or either kiosk channel's own
          # sync) between checkout and push. Rebase rather than force: this
          # commit is additive and touches only vesta-ai/, so it can never
          # conflict with a release or with another channel's manifest.
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing onto main"
            git fetch origin main && git rebase origin/main
          done
          echo "could not publish the ai manifest after 3 attempts"; exit 1
