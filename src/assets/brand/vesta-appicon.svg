  <!-- The V, centred and filling ~72% of the tile. It was 66% wide but hung
       high in the box, so it read smaller than it measured and left the plate
       looking empty next to other app icons. Centring it and lifting it to 72%
       puts it at the weight a platform icon normally gives its glyph. -->
